Donaldson, Riemann Surfaces", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "riemann-surfaces", "prereqs": ["complex-analysis", "smooth-manifolds"], "detail": "", "notes": "Author: Simon Donaldson. Uniformization and Riemann–Roch proved\nanalytically — solving the Laplace equation with Hilbert-space methods\nand forms — plus ℘, the Abel–Jacobi map, hyperbolic geometry. Short\nand motivated; shows the harmonic-theory idea behind Hodge theory in\ndimension one. Complements Miranda's algebraic approach."}, "dubrovin-fomenko-novikov-modern-geometry-1": {"label": "Dubrovin, Fomenko, Novikov — Modern Geometry: Methods and Applications, Part I", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "differential-geometry-classical", "prereqs": ["analysis-advanced", "linear-algebra-basic"], "detail": "", "notes": "Authors: Dubrovin, Fomenko, Novikov. Geometry of surfaces,\ntransformation groups, and tensor fields, always tied to mechanics,\nrelativity, and field theory. Computational and physics-flavored,\nunlike Western geometry texts; Parts II–III continue to manifolds and\ntopology."}, "durrett-probability": {"label": "Durrett, Probability: Theory and Examples", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "probability-basic", "prereqs": ["measure-theory"], "detail": "", "notes": "Author: Durrett. Graduate standard, measure-theoretic. Proof-centric\nwith heavy examples and exercises. Builds martingales, Brownian\nmotion, ergodic theory from measure-theoretic foundations."}, "edwards-fermats-last-theorem": {"label": "Edwards, Fermat's Last Theorem: A Genetic Introduction to Algebraic Number Theory", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebraic-number-theory", "prereqs": ["algebra-basic", "number-theory-basic"], "detail": "", "notes": "Author: Harold Edwards. Algebraic number theory built the way it\narose: Fermat and Euler, Kummer's ideal numbers for cyclotomic\nintegers, FLT for regular primes, and the link to Gauss's quadratic\nforms. Every concept arrives after a problem demands it; many\ncomputational exercises. The \"why\" book to read before or alongside\nMarcus. Same author as the historical *Galois Theory*."}, "edwards-galois-theory": {"label": "Edwards, Galois Theory", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "galois-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Harold Edwards. Follows Galois's own memoir and Lagrange's\nearlier work, then translates it into the modern theory. Historical\nand computational; includes Galois's paper in translation. A\ncontrasting companion to Stewart or Cox."}, "eisenbud-commutative-algebra": {"label": "Eisenbud, Commutative Algebra with a View Toward Algebraic Geometry", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "commutative-algebra-basic", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Eisenbud. Expansive, motivated, geometry-minded. Long."}, "eisenbud-harris-geometry-of-schemes": {"label": "Eisenbud & Harris, The Geometry of Schemes", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebraic-geometry", "prereqs": ["commutative-algebra-basic"], "detail": "", "notes": "Authors: Eisenbud, Harris. Schemes introduced through explicit\nexamples — fibered products, families, projective schemes — rather\nthan abstract definitions first. Good complement to Vakil."}, "enderton-elements-set-theory": {"label": "Enderton, Elements of Set Theory", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "set-theory-basic", "prereqs": [], "detail": "", "notes": "Author: Enderton. More thorough than Halmos. Careful build-up of ZFC,\nordinals, cardinals, axiom of choice. Well-exercised."}, "enderton-mathematical-logic": {"label": "Enderton, A Mathematical Introduction to Logic", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "logic-basic", "prereqs": [], "detail": "", "notes": "Author: Enderton. Advanced undergrad / early grad. Propositional and\nfirst-order logic, completeness, compactness, models, undecidability.\nCareful and well-exercised."}, "erdmann-wildon-lie-algebras": {"label": "Erdmann & Wildon, Introduction to Lie Algebras", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "lie-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Authors: Erdmann, Wildon. A leisurely route to the classification of\ncomplex semisimple Lie algebras: low-dimensional examples by hand,\nsl₂ representations, root systems, Dynkin diagrams. Plenty of\nexercises, solutions to those used later. Pure algebra, so the most\nLean-friendly way into Lie theory (Mathlib's Lie algebra library is\nsubstantial). Pairs with Stillwell or Hall on the group side."}, "etingof-introduction-representation-theory": {"label": "Etingof et al., Introduction to Representation Theory", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": true, "medium": "book", "url": "https://math.mit.edu/~etingof/reprbook.pdf", "course": "representation-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Authors: Etingof, Golberg, Hensel, Liu, Schwendner, Vaintrob, Yudovina.\nAlgebras and modules, finite groups, symmetric groups and Schur–Weyl\nduality, quivers and Gabriel's theorem, with category-theory and\nhomological-algebra appetizers. Much of the theory is developed in\nproblems (hints for the hard ones). From an MIT course; free online."}, "evans-pde": {"label": "Evans, Partial Differential Equations", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "partial-differential-equations", "prereqs": ["analysis-advanced", "measure-theory", "linear-algebra-basic"], "detail": "", "notes": "Author: Evans. Standard graduate PDE text. Part I motivates through\ntransport, Laplace, heat, and wave equations before general theory.\nProof-centric, well-exercised."}, "faddeev-sominsky-problems-higher-algebra": {"label": "Faddeev & Sominsky, Problems in Higher Algebra", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": true, "medium": "book", "url": "", "course": "linear-algebra-basic", "prereqs": [], "detail": "", "notes": "Authors: D. K. Faddeev, I. S. Sominsky. The classic Soviet problem\ncollection: complex numbers, determinants, matrices, polynomials,\nsymmetric functions, linear algebra. Answers included. Good\ncomputational practice alongside Axler."}, "feller-probability-vol-1": {"label": "Feller, An Introduction to Probability Theory and Its Applications, Vol. 1", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "probability-basic", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: Feller. Discrete probability only, in enormous depth:\nrandom walks, ballot problems, Markov chains, generating functions.\nClassic, example-heavy, and a pleasure to dip into."}, "folland-real-analysis": {"label": "Folland, Real Analysis: Modern Techniques and Their Applications", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "measure-theory", "prereqs": ["analysis-advanced"], "detail": "", "notes": "Author: Folland. Graduate standard: measure theory, Lp spaces,\ndistributions, Fourier analysis, probability. Compact and\nproof-centric. Skim after Axler or Tao for breadth (distributions,\nFourier) and the standard grad-level phrasing."}, "fomenko-fuchs-homotopical-topology": {"label": "Fomenko & Fuchs, Homotopical Topology", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "algebraic-topology", "prereqs": ["point-set-topology", "algebra-basic"], "detail": "", "notes": "Authors: Fomenko, Fuchs. Homotopy, fibrations, spectral sequences,\ncohomology operations, K-theory, with Fomenko's surreal illustrations.\nA Moscow-school graduate course; skim alongside or after Hatcher for\nanother route through the same ideas."}, "fong-spivak-seven-sketches": {"label": "Fong & Spivak, Seven Sketches in Compositionality", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "category-theory-elementary", "prereqs": [], "detail": "", "notes": "Authors: Fong, Spivak. *An Invitation to Applied Category Theory.*\nPosets, monoidal categories, profunctors, operads, and toposes via\napplications (databases, circuits, co-design). No algebra assumed;\nexercises with solutions throughout. Pairs naturally with Lawvere:\nsame \"categories for everyone\" spirit, more modern examples."}, "frankel-geometry-of-physics": {"label": "Frankel, The Geometry of Physics", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "smooth-manifolds", "prereqs": ["analysis-advanced", "linear-algebra-basic"], "detail": "", "notes": "Author: Frankel. Manifolds, forms, bundles, connections, and\ncharacteristic classes, each illustrated by physics (mechanics,\nelectromagnetism, gauge theory). Written for physicists who want the\nreal math. Browse chapters as the corresponding topics come up."}, "fuchs-tabachnikov-mathematical-omnibus": {"label": "Fuchs & Tabachnikov, Mathematical Omnibus", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "mathematical-panorama", "prereqs": [], "detail": "", "notes": "Authors: Fuchs, Tabachnikov. *Thirty Lectures on Classic Mathematics.*\nSelf-contained lectures across algebra, arithmetic, geometry,\ntopology, dynamics — cubics, Chebyshev polynomials, the four-vertex\ntheorem, Poncelet, billiards — each ending with exercises. A\nRussian-school \"desert island book\"; mostly geometric."}, "fulton-algebraic-curves": {"label": "Fulton, Algebraic Curves", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "https://onlinebooks.library.upenn.edu/webbin/book/lookupid?key=olbp45400", "course": "algebraic-geometry-classical", "prereqs": ["algebra-basic", "commutative-algebra-basic"], "detail": "", "notes": "Author: William Fulton. *An Introduction to Algebraic Geometry.*\nAffine and projective plane curves, local rings, intersection\nmultiplicities, Bézout, the group law on cubics, Riemann–Roch by\nNoether's elementary method. About 120 pages; the dense exercise sets\nare the best part. Concrete bridge from Reid or Cox–Little–O'Shea\ntoward Vakil. Free PDF from the author."}, "fulton-algebraic-topology": {"label": "Fulton, Algebraic Topology: A First Course", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebraic-topology", "prereqs": ["point-set-topology", "algebra-basic"], "detail": "", "notes": "Author: Fulton. Gentler alternative to Hatcher. Covers fundamental\ngroup, covering spaces, homology, with many concrete examples from\ncomplex analysis and geometry."}, "fulton-harris-representation-theory": {"label": "Fulton & Harris, Representation Theory: A First Course", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "representation-theory", "prereqs": ["linear-algebra-basic", "algebra-basic"], "detail": "", "notes": "Authors: Fulton, Harris. Graduate representation theory with three\nfull chapters on explicit sl₂ and sl₃ before the general theory. Lie\ngroups, Lie algebras, finite groups. Central to the Langlands arc."}, "gathmann-algebraic-geometry-notes": {"label": "Gathmann, Algebraic Geometry (notes)", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "notes", "url": "https://agag-gathmann.math.rptu.de/en/alggeom.php", "course": "algebraic-geometry-classical", "prereqs": ["commutative-algebra-basic"], "detail": "", "notes": "Author: Andreas Gathmann (2021/22, updated 2026). Affine varieties,\nZariski topology, sheaves of regular functions, morphisms, abstract\nand projective varieties, dimension, smoothness. Carefully motivated\nwith pictures, examples, and exercises every chapter; uses sheaves\nfrom the start so the move to schemes is smooth. Widely called the\nbest free first course in varieties."}, "gathmann-commutative-algebra-notes": {"label": "Gathmann, Commutative Algebra (notes)", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "notes", "url": "https://agag-gathmann.math.rptu.de/en/commalg.php", "course": "commutative-algebra-basic", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Andreas Gathmann. The Atiyah–Macdonald syllabus — ideals,\nmodules, tensor products, localization, chain conditions, primary\ndecomposition, integral extensions, Nullstellensatz, dimension,\nvaluation rings, Dedekind domains — with the geometric meaning of each\nnotion and exercises throughout. The motivated first read, with A–M\nas the later skim."}, "gelbaum-olmsted-counterexamples-analysis": {"label": "Gelbaum & Olmsted, Counterexamples in Analysis", "status": "open", "covered": true, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "analysis-foundations", "prereqs": [], "detail": "", "notes": "Authors: Gelbaum, Olmsted. Pathological functions, sequences, and\nsets that show why each hypothesis in real analysis is needed.\nBrowsing book; good right after Tao I."}, "gelfand-lectures-linear-algebra": {"label": "Gelfand, Lectures on Linear Algebra", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "linear-algebra-basic", "prereqs": [], "detail": "", "notes": "Author: I. M. Gelfand. Short lecture course from Moscow State:\nn-dimensional spaces, bilinear forms, linear transformations,\ncanonical forms, tensors. Conversational and geometric, written as\nthe lectures were given. A quick read next to Axler."}, "getz-hahn-automorphic-representations": {"label": "Getz & Hahn, An Introduction to Automorphic Representations", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "automorphic-forms", "prereqs": ["modular-forms", "class-field-theory", "representation-theory", "lie-theory", "functional-analysis"], "detail": "", "notes": "Authors: Getz, Hahn. *With a View Toward Trace Formulae* (GTM 300,\n2024). Adeles, reductive groups, unramified local representations and\nthe Satake isomorphism, automorphic representations, a statement of\nfunctoriality, cohomology of locally symmetric spaces, trace formulae.\nExercises per chapter, but graduate-dense: the far end of the arc.\nRead Tate's thesis and Diamond–Shurman first."}, "gouvea-p-adic-numbers": {"label": "Gouvêa, p-adic Numbers: An Introduction", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "p-adic-numbers", "prereqs": ["algebra-basic", "analysis-foundations", "number-theory-basic"], "detail": "", "notes": "Author: Fernando Gouvêa. Absolute values, constructing ℚ_p, Hensel's\nlemma, analysis in ℚ_p, finite extensions, ℂ_p. Chatty and motivated —\nit explores before it proves — with about 360 exercises. Widely\nrecommended as the beginner's text. The motivated entry to local\nfields, instead of starting from Serre."}, "gowers-princeton-companion": {"label": "Gowers (ed.), The Princeton Companion to Mathematics", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "mathematical-panorama", "prereqs": [], "detail": "", "notes": "Editors: Gowers, Barrow-Green, Leader. A 1000-page expository survey:\nconcepts, branch overviews (arithmetic geometry, representation\ntheory, …), famous theorems and problems. Not for cover-to-cover —\nread the relevant branch article before starting each new course."}, "grimmett-stirzaker-probability": {"label": "Grimmett & Stirzaker, Probability and Random Processes", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "probability-basic", "prereqs": ["analysis-advanced"], "detail": "", "notes": "Authors: Grimmett, Stirzaker. Advanced-undergrad to early-grad\nprobability. Broad, narrative, example-rich, heavy exercises.\nCovers discrete and continuous probability, random processes,\nsome measure-theoretic foundations."}, "gross-abstract-algebra-videos": {"label": "Gross, Abstract Algebra — Harvard Math 122 (video lectures)", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PLelIK3uylPMGzHBuR3hLMHrYfMqWWsmx5", "course": "algebra-basic", "prereqs": ["linear-algebra-basic"], "detail": "", "notes": "Lecturer: Benedict Gross (Harvard, Fall 2003). All 38 lectures —\ngroups, actions, bilinear forms, rings, fields — following Artin's\n*Algebra* closely, with problems assigned every lecture (syllabus:\nhttps://abel.math.harvard.edu/archive/122_fall_03/). One of the best\nrecorded algebra courses: motivated, linear algebra woven into group\ntheory. Do it with Artin right after Axler. Note: an unofficial\nre-upload; the often-cited older playlist is now incomplete."}, "guillemin-pollack-differential-topology": {"label": "Guillemin & Pollack, Differential Topology", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "differential-topology", "prereqs": ["analysis-advanced", "point-set-topology"], "detail": "", "notes": "Authors: Guillemin, Pollack. Short, example-driven differential\ntopology: transversality, intersection theory, degree, Poincaré–\nHopf. Introduces manifolds leanly as needed. Classic."}, "hairer-wanner-analysis-by-its-history": {"label": "Hairer & Wanner, Analysis by Its History", "status": "open", "covered": true, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "analysis-foundations", "prereqs": [], "detail": "", "notes": "Authors: Hairer, Wanner. Calculus in the order it was discovered —\nNewton, Leibniz, Euler computations first (series, continued\nfractions, Euler–Maclaurin), then 19th-century rigor. 173 figures;\nexercises drawn from original papers. A historical skim after Tao I."}, "hall-lie-groups": {"label": "Hall, Lie Groups, Lie Algebras, and Representations", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "lie-theory", "prereqs": ["linear-algebra-basic", "analysis-advanced"], "detail": "", "notes": "Author: Brian Hall. Matrix Lie groups first, so no manifold theory is\nneeded; then Lie algebras, the Baker–Campbell–Hausdorff formula,\nsl(2) and sl(3) representations worked by hand, root systems,\nhighest weights. Concrete, motivated, exercised."}, "halmos-finite-dimensional-vector-spaces": {"label": "Halmos, Finite-Dimensional Vector Spaces", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "linear-algebra-basic", "prereqs": [], "detail": "", "notes": "Author: Halmos. The 1942 classic that shaped how linear algebra is\ntaught (Axler descends from it). Written to generalize: operators\nand duality framed as they appear in Hilbert space. Terse, elegant;\nskim it next to Axler for a second perspective."}, "halmos-naive-set-theory": {"label": "Halmos, Naive Set Theory", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "set-theory-basic", "prereqs": [], "detail": "", "notes": "Author: Halmos. Short, classic introduction to axiomatic set theory\npresented in a readable style. Covers axioms through ordinals and\ncardinals in ~100 pages. Light on exercises."}, "hardy-wright-theory-of-numbers": {"label": "Hardy & Wright, An Introduction to the Theory of Numbers", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "number-theory-basic", "prereqs": [], "detail": "", "notes": "Authors: Hardy, Wright. The classic tour of elementary and analytic\nnumber theory: primes, continued fractions, approximation, partitions,\nquadratic fields. No exercises; each chapter stands alone. Made for\ndipping into."}, "harris-algebraic-geometry-first-course": {"label": "Harris, Algebraic Geometry: A First Course", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebraic-geometry-classical", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Joe Harris. Classical variety-theoretic algebraic geometry,\nexamples-first. Natural pre-schemes entry before Vakil or\nHartshorne. Light on commutative algebra prereqs."}, "hatcher-algebraic-topology": {"label": "Hatcher, Algebraic Topology", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "https://pi.math.cornell.edu/~hatcher/AT/ATpage.html", "course": "algebraic-topology", "prereqs": ["point-set-topology", "linear-algebra-basic", "algebra-basic"], "detail": "", "notes": "Author: Hatcher. Fundamental group, homology, cohomology. Narrative,\nexample-rich. Free online."}, "hatcher-topology-of-numbers": {"label": "Hatcher, Topology of Numbers", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "https://pi.math.cornell.edu/~hatcher/TN/TNpage.html", "course": "number-theory-basic", "prereqs": ["linear-algebra-basic"], "detail": "", "notes": "Author: Allen Hatcher (AMS 2022; free PDF). The Farey diagram,\ncontinued fractions, linear fractional transformations, then binary\nquadratic forms through Conway's topograph — Pell's equation, class\nnumbers, genus theory. Visual and geometric, exercises every chapter.\nLeads into Cox's *Primes of the Form x²+ny²* and to SL₂(ℤ), the\ndoorway to modular forms."}, "hatcher-vector-bundles-k-theory": {"label": "Hatcher, Vector Bundles and K-Theory (notes)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://pi.math.cornell.edu/~hatcher/VBKT/VBpage.html", "course": "characteristic-classes", "prereqs": ["algebraic-topology"], "detail": "", "notes": "Author: Allen Hatcher. Vector bundles and classifying spaces,\ntopological K-theory and Bott periodicity, characteristic classes.\nPartial but polished, with Hatcher's pictures and exercises. The\nmotivated partner to Milnor–Stasheff."}, "hilbert-cohn-vossen-geometry-imagination": {"label": "Hilbert & Cohn-Vossen, Geometry and the Imagination", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "german", "problems": false, "medium": "book", "url": "", "course": "differential-geometry-classical", "prereqs": [], "detail": "", "notes": "Authors: Hilbert, Cohn-Vossen (1932). Curves and surfaces,\nlattices, projective configurations, differential geometry,\nkinematics, topology — all intuitively, with no exercises. A\nvisual-geometry classic from another era, in the spirit of Needham."}, "hirsch-smale-devaney-differential-equations": {"label": "Hirsch, Smale, Devaney — Differential Equations, Dynamical Systems, and an Introduction to Chaos", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "ordinary-differential-equations", "prereqs": ["analysis-advanced", "linear-algebra-basic"], "detail": "", "notes": "Authors: Hirsch, Smale, Devaney. Geometric, example-driven\nintroduction to ODE and dynamical systems. Phase portraits,\nstability, bifurcations, chaos. Narrative and well-motivated."}, "hitchin-differentiable-manifolds-notes": {"label": "Hitchin, Differentiable Manifolds (Oxford notes)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://people.maths.ox.ac.uk/hitchin/files/LectureNotes/Differentiable_manifolds/manifolds2014.pdf", "course": "smooth-manifolds", "prereqs": ["point-set-topology", "analysis-advanced"], "detail": "", "notes": "Author: Nigel Hitchin. Manifolds, tangent and vector bundles, flows,\nforms, de Rham cohomology, Stokes, a glimpse of metrics — 94 elegant\npages by a master geometer. Skim alongside Lee or Tu. His surfaces and\nalgebraic curves notes are on the same site."}, "hofstadter-godel-escher-bach": {"label": "Hofstadter, Gödel, Escher, Bach", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "logic-basic", "prereqs": [], "detail": "", "notes": "Author: Hofstadter. Formal systems, self-reference, recursion, and\nincompleteness through dialogues, music, and art. Not a textbook;\na long, playful meditation that makes the ideas in\n[[logic-basic]] feel alive."}, "hott-book": {"label": "Univalent Foundations Program — Homotopy Type Theory", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "https://homotopytypetheory.org/book/", "course": "type-theory", "prereqs": ["logic-basic"], "detail": "", "notes": "Authors: the Univalent Foundations Program. Dependent type theory\nwith the univalence axiom, higher inductive types, and homotopy\ntheory developed synthetically. Collaborative and informal-rigorous;\nfree online. Skim for how type theory can serve as foundations,\ndifferent from Lean's classical setup."}, "hubbard-vector-calculus-forms": {"label": "Hubbard & Hubbard, Vector Calculus, Linear Algebra, and Differential Forms", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "analysis-advanced", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Authors: John H. Hubbard, Barbara Burke Hubbard. Multivariable\nanalysis done properly — linear algebra, inverse and implicit\nfunction theorems, manifolds in Rⁿ, integration, and differential\nforms with Stokes's theorem — with motivation, pictures, and a huge\nexercise set. The best on-ramp to the differential-geometry track:\nforms appear here concretely before [[smooth-manifolds]]."}, "huybrechts-complex-geometry": {"label": "Huybrechts, Complex Geometry: An Introduction", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "complex-geometry", "prereqs": ["smooth-manifolds", "complex-analysis", "algebraic-topology"], "detail": "", "notes": "Author: Daniel Huybrechts. Several complex variables, complex and\nKähler manifolds, Hodge theory, bundles with connections and\ncurvature, Chern classes, Kodaira vanishing and embedding;\nappendices on sheaf cohomology. Streamlined, with illustrative\nexercises. The standard modern first book — much gentler than\nGriffiths–Harris, which is a poor first book."}, "ireland-rosen": {"label": "Ireland & Rosen, A Classical Introduction to Modern Number Theory", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "number-theory-basic", "prereqs": ["algebra-basic"], "detail": "", "notes": "Authors: Ireland, Rosen. Bridges elementary NT to algebraic and\narithmetic geometry: rings of integers, ideal theory, zeta and\nL-functions, elliptic curves. Well-motivated and a natural step\ntoward Silverman."}, "james-liebeck-representations": {"label": "James & Liebeck, Representations and Characters of Groups", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "representation-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Authors: James, Liebeck. Undergraduate representation theory of\nfinite groups: modules, Maschke, characters, orthogonality, character\ntables computed in detail, induced characters. Slow and very\nconcrete, with solved exercises. The gentle entry before Fulton–Harris."}, "jameson-prime-number-theorem": {"label": "Jameson, The Prime Number Theorem", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "analytic-number-theory", "prereqs": ["complex-analysis", "number-theory-basic"], "detail": "", "notes": "Author: G. J. O. Jameson. Summation methods, Dirichlet series,\nMöbius inversion, zeta, two complete analytic proofs of the prime\nnumber theorem, then primes in progressions and Dirichlet\nL-functions. Lucid, motivated, many examples and exercises; one big\ntheorem as the goal."}, "kato-kurokawa-saito-number-theory-1": {"label": "Kato, Kurokawa, Saito — Number Theory 1: Fermat's Dream", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "japanese", "problems": false, "medium": "book", "url": "", "course": "algebraic-number-theory", "prereqs": ["number-theory-basic", "algebra-basic"], "detail": "", "notes": "Authors: Kato, Kurokawa, Saito (Iwanami series). From Fermat's\nmarginal notes to modern theory: rational points on conics and\nelliptic curves, p-adic numbers, quadratic reciprocity, zeta values,\nalgebraic number fields. Motivated, historical, example-first, with\nexercises. Volume 2 continues into class field theory."}, "katok-climenhaga-lectures-on-surfaces": {"label": "Katok & Climenhaga, Lectures on Surfaces", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "differential-geometry-classical", "prereqs": ["analysis-foundations", "linear-algebra-basic"], "detail": "", "notes": "Authors: Anatole Katok, Vaughn Climenhaga. *(Almost) Everything You\nWanted to Know about Them.* Organized around the Euler characteristic,\nwhich reappears through combinatorics, homology, Morse theory,\nvector-field indices, and Gauss–Bonnet, on recurring examples. Concrete,\nexercised, proves nearly everything. Example-first bridge between do\nCarmo and algebraic topology."}, "katok-p-adic-analysis": {"label": "Katok, p-adic Analysis Compared with Real", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "p-adic-numbers", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: Svetlana Katok. About 150 pages setting p-adic analysis side\nby side with real analysis: completions, total disconnectedness,\nCantor sets, sequences and series, p-adic functions. Many exercises,\nmost with hints or solutions. The analysis-flavored companion to\nGouvêa's number-theoretic one; reinforces point-set topology too."}, "kedlaya-class-field-theory-notes": {"label": "Kedlaya, Notes on Class Field Theory", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://kskedlaya.org/cft/", "course": "class-field-theory", "prereqs": ["algebraic-number-theory"], "detail": "", "notes": "Author: Kiran Kedlaya (Berkeley 254B, revised 2025). States class\nfield theory first, proves Kronecker–Weber, then builds group\ncohomology and the local and global theory. Deliberately informal —\nread it for the overview and the *why* before Milne's proofs."}, "khinchin-continued-fractions": {"label": "Khinchin, Continued Fractions", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "number-theory-basic", "prereqs": [], "detail": "", "notes": "Author: A. Ya. Khinchin. About 100 pages: convergents, approximation\nof irrationals, and the metric theory of continued fractions\n(Khinchin's constant). A model of short, lucid exposition; an evening's\nread alongside elementary number theory."}, "kirwan-complex-algebraic-curves": {"label": "Kirwan, Complex Algebraic Curves", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "riemann-surfaces", "prereqs": ["complex-analysis", "algebra-basic", "point-set-topology"], "detail": "", "notes": "Author: Frances Kirwan. Plane curves in ℂP², Bézout, the group law on\ncubics, degree–genus via branched covers, ℘, Riemann surfaces and\ndifferentials, Abel and Riemann–Roch. Written for undergraduates,\nmixing algebra, topology, and analysis with historical motivation and\nchapter exercises. An easier on-ramp than Miranda; ties to elliptic\ncurves."}, "koblitz-elliptic-curves-modular-forms": {"label": "Koblitz, Introduction to Elliptic Curves and Modular Forms", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "modular-forms", "prereqs": ["algebra-basic", "number-theory-basic", "complex-analysis"], "detail": "", "notes": "Author: Koblitz. Elliptic curves from a modular-forms perspective —\ncongruent number problem, Eisenstein series, Hecke operators.\nDirect step on the modular-forms leg of the Langlands arc."}, "kolmogorov-fomin-introductory-real-analysis": {"label": "Kolmogorov & Fomin, Introductory Real Analysis", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "functional-analysis", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Authors: Kolmogorov, Fomin. Set theory, metric and topological\nspaces, normed spaces, linear functionals, measure, Lebesgue\nintegration, Hilbert spaces, integral equations. The Moscow\nintroduction to functional analysis; compact, with problems."}, "korner-fourier-analysis": {"label": "Körner, Fourier Analysis", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "fourier-analysis", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: T. W. Körner. About 100 short linked essays — Fourier series,\northogonal expansions, transforms, ODEs, Brownian motion, history,\napplications. Witty and discursive, a shop window rather than a\ncourse; a separate *Exercises for Fourier Analysis* volume supplies\nproblems."}, "kostrikin-manin-linear-algebra-geometry": {"label": "Kostrikin & Manin, Linear Algebra and Geometry", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "linear-algebra-basic", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Authors: Kostrikin, Manin. Linear algebra as geometry and physics:\naffine and projective spaces, quadrics, tensors, and a running thread\non quantum mechanics. Dense and far-ranging; skim for the view of\nlinear algebra from above, after Axler."}, "kunen-foundations-of-mathematics": {"label": "Kunen, The Foundations of Mathematics", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "logic-basic", "prereqs": ["set-theory-basic"], "detail": "", "notes": "Author: Kenneth Kunen. Set theory, model theory with formal proofs\nand completeness, and recursion theory as one system; unusually honest\nabout the metatheory — what it means to formalize mathematics inside\nZFC. Compact; skim after Enderton or Avigad."}, "laczkovich-conjecture-and-proof": {"label": "Laczkovich, Conjecture and Proof", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "hungarian", "problems": true, "medium": "book", "url": "", "course": "number-theory-basic", "prereqs": ["analysis-foundations", "set-theory-basic"], "detail": "", "notes": "Author: Miklós Laczkovich (Budapest Semesters). Impossibility proofs —\nirrationality, constructions, transcendence of e, Hilbert's third\nproblem — then existence proofs: pigeonhole, Banach–Tarski, Borel\nhierarchy. Deep results by elementary means, problem-driven. A short\ndetour with self-contained Lean-friendly theorems."}, "lawvere-schanuel-conceptual-mathematics": {"label": "Lawvere & Schanuel, Conceptual Mathematics", "status": "reading", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "category-theory-elementary", "prereqs": [], "detail": "", "notes": "Authors: Lawvere, Schanuel. *A First Introduction to Categories.*\nCategory theory from scratch with no algebra assumed: sets and maps,\ncomposition, isomorphisms, sections and retractions, universal\nproperties, products and coproducts, graphs and dynamical systems as\ncategories, a first look at toposes. Organized as articles plus\ntranscribed classroom sessions — slow, conversational, concrete.\nNot a substitute for [[category-theory]] (Leinster and Riehl draw\ntheir examples from algebra), but an on-ramp that makes them read\nfaster."}, "lee-riemannian-manifolds": {"label": "Lee, Introduction to Riemannian Manifolds", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "riemannian-geometry", "prereqs": ["smooth-manifolds"], "detail": "", "notes": "Author: Lee. Natural follow-up to Lee's *Smooth Manifolds*. Covers\nconnections, geodesics, curvature, comparison theorems. Same\npedagogical style — thorough and well-exercised."}, "lee-smooth-manifolds": {"label": "Lee, Introduction to Smooth Manifolds", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "smooth-manifolds", "prereqs": ["analysis-advanced", "linear-algebra-basic", "point-set-topology"], "detail": "", "notes": "Author: Lee. Comprehensive graduate text on smooth manifolds: tangent\nbundles, vector fields, differential forms, Lie groups, de Rham\ncohomology. Thorough, well-exercised, long."}, "lee-topological-manifolds": {"label": "Lee, Introduction to Topological Manifolds", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "point-set-topology", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: Lee. Point-set topology developed with manifolds as the\nrunning example, then fundamental group, covering spaces, and\nsingular homology. Same thorough, exercised style as his *Smooth\nManifolds*, which it is designed to precede. Alternative to Munkres\nthat doubles as a first pass at [[algebraic-topology]]."}, "leinster-basic-category-theory": {"label": "Leinster, Basic Category Theory", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "https://arxiv.org/abs/1612.09375", "course": "category-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Leinster. Short, narrative, free online. Covers adjoints,\nlimits, representables, Yoneda at a pace suitable for a first\nencounter. Heavy on motivation."}, "liu-algebraic-geometry-arithmetic-curves": {"label": "Liu, Algebraic Geometry and Arithmetic Curves", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebraic-geometry", "prereqs": ["commutative-algebra-basic", "algebraic-number-theory"], "detail": "", "notes": "Author: Qing Liu. Schemes, cohomology, and curves with an arithmetic\nbent throughout (schemes over Dedekind rings), then arithmetic\nsurfaces, intersection theory, reduction of curves, stable reduction.\nNearly 600 exercises. Not a first schemes book — the bridge from Vakil\nto arithmetic geometry proper (models, reduction of elliptic curves)."}, "lovasz-combinatorial-problems-exercises": {"label": "Lovász, Combinatorial Problems and Exercises", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "hungarian", "problems": true, "medium": "book", "url": "", "course": "combinatorics-basic", "prereqs": ["linear-algebra-basic"], "detail": "", "notes": "Author: László Lovász (Hungarian school). Enumeration, sieves,\npermutations, graph theory, matchings, hypergraphs, Ramsey theory —\nentirely as problems, each with a hint and a full solution. Designed\nto be worked through as a course."}, "mac-lane-categories-working-mathematician": {"label": "Mac Lane, Categories for the Working Mathematician", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "category-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Mac Lane. The founding textbook, by one of the founders.\nTerse, reference-like, examples drawn from across algebra and\ntopology. Skim it after Leinster or Riehl to see the canonical\npresentation."}, "macbeth-mechanics-of-proof": {"label": "Macbeth, The Mechanics of Proof", "status": "open", "covered": true, "skimmed": false, "companion": false, "tradition": "", "problems": true, "medium": "book", "url": "https://hrmacbeth.github.io/math2001/", "course": "formalization-lean", "prereqs": [], "detail": "", "notes": "Author: Heather Macbeth. An intro-to-proof course written in parallel\nin English and Lean 4: calculation, logic, induction, number theory,\nfunctions, relations, sets. Hundreds of exercises done on paper and in\nLean. Below this reader's mathematical level, but the gentlest way to\nbuild Lean fluency. Free online."}, "maccluer-elementary-functional-analysis": {"label": "MacCluer, Elementary Functional Analysis", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "functional-analysis", "prereqs": ["measure-theory", "linear-algebra-basic"], "detail": "", "notes": "Author: Barbara MacCluer. Hilbert spaces, Banach spaces and the big\nthree theorems, compact and self-adjoint operators, Banach and\nC*-algebras, the spectral theorem, in about 200 pages. Written for\nself-study, full of history and asides, good exercises. Gentler and\nmore motivated than Brezis or Reed–Simon."}, "madsen-tornehave-calculus-to-cohomology": {"label": "Madsen & Tornehave, From Calculus to Cohomology", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "characteristic-classes", "prereqs": ["smooth-manifolds"], "detail": "", "notes": "Authors: Madsen, Tornehave. *De Rham Cohomology and Characteristic\nClasses.* De Rham cohomology of open sets in Rⁿ, then manifolds,\nintegration, Morse theory, vector-field indices, Poincaré duality,\nbundles, connections and curvature, Chern and Euler classes, Thom\nisomorphism, general Gauss–Bonnet. Self-contained, concrete, about\n150 exercises, no algebraic topology assumed. The most on-taste road\nto characteristic classes."}, "makarov-selected-problems-real-analysis": {"label": "Makarov, Goluzina, Lodkin, Podkorytov — Selected Problems in Real Analysis", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": true, "medium": "book", "url": "", "course": "analysis-advanced", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Authors: Makarov, Goluzina, Lodkin, Podkorytov (St. Petersburg).\nSequences and series, inequalities, integrals, asymptotics, convexity,\nreal-variable theory. Harder than Demidovich; many problems are\nfolklore theorems, with brief solutions. A Pólya–Szegő-level source\nto dip into during advanced analysis."}, "manin-course-mathematical-logic": {"label": "Manin, A Course in Mathematical Logic for Mathematicians", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "logic-basic", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Yu. I. Manin. Logic written for working mathematicians:\nformal languages, Gödel's theorems, computability, set theory\n(including forcing), plus philosophical and historical digressions.\nOpinionated and wide-ranging; skim next to Avigad or Enderton."}, "manin-panchishkin-modern-number-theory": {"label": "Manin & Panchishkin, Introduction to Modern Number Theory", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "algebraic-number-theory", "prereqs": ["algebra-basic", "number-theory-basic"], "detail": "", "notes": "Authors: Manin, Panchishkin. *Fundamental Problems, Ideas and\nTheories.* A survey of the whole landscape — Diophantine equations,\narithmetic of fields, zeta and L-functions, modular forms,\nnon-abelian class field theory and Langlands, Wiles's proof — each\ntheory introduced through elementary problems. No exercises: a map of\nwhere every course on the arc is heading. Reread periodically."}, "marcus-number-fields": {"label": "Marcus, Number Fields", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebraic-number-theory", "prereqs": ["algebra-basic", "number-theory-basic", "galois-theory"], "detail": "", "notes": "Author: Marcus. Advanced-undergrad algebraic number theory. Exceptionally\nnarrative and exercise-driven — builds rings of integers, ideal class\ngroups, and Dirichlet's unit theorem through hands-on computation."}, "marker-model-theory": {"label": "Marker, Model Theory: An Introduction", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "model-theory", "prereqs": ["logic-basic", "algebra-basic"], "detail": "", "notes": "Author: Marker. Graduate model theory grounded in explicit examples\nfrom algebra — definability, quantifier elimination, types,\nω-stability. A leading text in the area."}, "matousek-nesetril-invitation-discrete-mathematics": {"label": "Matoušek & Nešetřil, Invitation to Discrete Mathematics", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "czech", "problems": false, "medium": "book", "url": "", "course": "combinatorics-basic", "prereqs": [], "detail": "", "notes": "Authors: Matoušek, Nešetřil (Prague). Counting, graphs, trees,\nplanarity, double counting, the probabilistic method, finite\nprojective planes, generating functions, linear algebra in\ncombinatorics. Selected topics in depth, over 400 exercises with\nhints, built to form a problem-solving habit. A warmer primary than\nWest's *Combinatorial Mathematics*."}, "may-concise-algebraic-topology": {"label": "May, A Concise Course in Algebraic Topology", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebraic-topology", "prereqs": ["point-set-topology", "algebra-basic"], "detail": "", "notes": "Author: J. Peter May. Algebraic topology in categorical language —\nfibrations, cofibrations, homology axioms, K-theory, cobordism —\nat high speed. Skim alongside or after Hatcher to see the modern structure."}, "milne-algebraic-geometry-notes": {"label": "Milne, Algebraic Geometry (notes)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://www.jmilne.org/math/CourseNotes/ag.html", "course": "algebraic-geometry-classical", "prereqs": ["commutative-algebra-basic"], "detail": "", "notes": "Author: J. S. Milne. Algebraic varieties over algebraically closed\nand general fields, with a short treatment of schemes, in about 230\npages. Terser than Gathmann; skim as a second view."}, "milne-algebraic-number-theory-notes": {"label": "Milne, Algebraic Number Theory (notes)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://www.jmilne.org/math/CourseNotes/ant.html", "course": "algebraic-number-theory", "prereqs": ["galois-theory", "commutative-algebra-basic"], "detail": "", "notes": "Author: J. S. Milne. Dedekind domains, class groups, units,\ncyclotomic fields, valuations, local and global fields, in 166 pages\nwith exercises. Terser than Sutherland; consolidates and sets up\nMilne's class field theory notes with the same conventions."}, "milne-class-field-theory": {"label": "Milne, Class Field Theory (notes)", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "notes", "url": "https://www.jmilne.org/math/CourseNotes/cft.html", "course": "class-field-theory", "prereqs": ["algebraic-number-theory"], "detail": "", "notes": "Author: J. S. Milne. Local class field theory (Lubin–Tate and\ncohomological), global CFT ideal-theoretically and via ideles, the\nBrauer group. Exercises with solutions, many historical asides.\nWidely used as a course text. Full cohomological proofs after\nChildress's gentler first pass."}, "milne-fields-galois-theory-notes": {"label": "Milne, Fields and Galois Theory (notes)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://www.jmilne.org/math/CourseNotes/ft.html", "course": "galois-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: J. S. Milne. Splitting fields, the fundamental theorem,\ncomputing Galois groups, transcendence, infinite Galois theory, in\n144 pages with exercises and solutions. The profinite chapter matters\nlater for Galois representations; a second pass after Cox or Stewart."}, "milne-group-theory-notes": {"label": "Milne, Group Theory (notes)", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://www.jmilne.org/math/CourseNotes/gt.html", "course": "algebra-basic", "prereqs": [], "detail": "", "notes": "Author: J. S. Milne. Groups, actions, Sylow theorems, subnormal\nseries, representations of finite groups, with exercises and\nsolutions, in about 150 pages. A concise second pass for the group\ntheory in Pinter or Artin."}, "milne-modular-functions-forms-notes": {"label": "Milne, Modular Functions and Modular Forms (notes)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://www.jmilne.org/math/CourseNotes/mf.html", "course": "modular-forms", "prereqs": ["complex-analysis", "riemann-surfaces", "algebraic-number-theory"], "detail": "", "notes": "Author: J. S. Milne. Modular curves as Riemann surfaces, elliptic\nfunctions, Hecke operators, X₀(N) over ℚ, moduli, L-series,\nEichler–Shimura, complex multiplication. More geometric than most\naccounts; the arithmetic-geometric view next to Diamond–Shurman."}, "milnor-stasheff-characteristic-classes": {"label": "Milnor & Stasheff, Characteristic Classes", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "characteristic-classes", "prereqs": ["smooth-manifolds", "algebraic-topology"], "detail": "", "notes": "Authors: Milnor, Stasheff. Foundational treatment of vector bundles\nand characteristic classes — Stiefel–Whitney, Chern, Pontryagin.\nTerse but deeply influential; a jewel. Best read after Bott–Tu or Tu\nhas made the objects familiar."}, "miranda-algebraic-curves-riemann-surfaces": {"label": "Miranda, Algebraic Curves and Riemann Surfaces", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "riemann-surfaces", "prereqs": ["point-set-topology", "complex-analysis"], "detail": "", "notes": "Author: Miranda. Concrete introduction to algebraic geometry via\nRiemann surfaces — divisors, sheaves, Riemann–Roch on curves.\nWell-motivated, example-rich."}, "morandi-field-galois-theory": {"label": "Morandi, Field and Galois Theory", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "galois-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Morandi. Graduate-level, thorough, with many exercises.\nBroader than Cox or Stewart: infinite Galois extensions,\ntranscendence, separability. Reference-grade — a second pass, not a\nfirst book."}, "morita-geometry-differential-forms": {"label": "Morita, Geometry of Differential Forms", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "japanese", "problems": false, "medium": "book", "url": "", "course": "characteristic-classes", "prereqs": ["smooth-manifolds", "algebraic-topology"], "detail": "", "notes": "Author: Shigeyuki Morita (Iwanami series). Forms, de Rham's theorem,\nFrobenius, then Laplacians and harmonic forms, bundles, and\nChern–Weil theory in about 300 pages. Compact and elegant in the\nJapanese textbook style. A second pass over the forms → harmonic forms\n→ characteristic classes arc after Lee or Tu."}, "mumford-red-book": {"label": "Mumford, The Red Book of Varieties and Schemes", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebraic-geometry", "prereqs": ["commutative-algebra-basic"], "detail": "", "notes": "Author: Mumford. Lecture notes from the 1960s introducing schemes to\ngeometers, with the famous pictures of Spec Z[x]. Dense, few\nexercises. Skim for the geometric intuition alongside Vakil."}, "munkres-topology": {"label": "Munkres, Topology", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "point-set-topology", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: Munkres. Standard point-set topology, then algebraic topology\nin Part II. Plan: Part I only."}, "murty-esmonde-problems-algebraic-number-theory": {"label": "Murty & Esmonde, Problems in Algebraic Number Theory", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": true, "medium": "book", "url": "", "course": "algebraic-number-theory", "prereqs": ["algebra-basic", "galois-theory"], "detail": "", "notes": "Authors: M. Ram Murty, Jody Esmonde. Algebraic number theory taught\nthrough problems with complete solutions: integral bases, Dedekind\ndomains, ideal class groups, units, quadratic reciprocity, Dirichlet\ndensity. Each chapter a short exposition followed by exercises that\ncarry the theory. A problem-first route through the course."}, "murty-problems-analytic-number-theory": {"label": "Murty, Problems in Analytic Number Theory", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": true, "medium": "book", "url": "", "course": "analytic-number-theory", "prereqs": ["complex-analysis", "number-theory-basic"], "detail": "", "notes": "Author: M. Ram Murty. About 500 problems with full solutions:\narithmetic functions, primes in progressions, the PNT, sieves,\nDirichlet and Hecke L-functions, p-adic methods. Works as both text\nand problem book. Sibling of Murty–Esmonde; harder than Stopple."}, "nederpelt-geuvers-type-theory": {"label": "Nederpelt & Geuvers, Type Theory and Formal Proof", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "type-theory", "prereqs": [], "detail": "", "notes": "Authors: Nederpelt, Geuvers. Untyped and simply typed lambda calculus,\ndependent types, the calculus of constructions, and how mathematics\nis encoded in it: the theory behind Lean. Written for readers with no\nbackground, heavily exercised."}, "needham-visual-complex-analysis": {"label": "Needham, Visual Complex Analysis", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "complex-analysis", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: Needham. Complex analysis through geometry: Möbius maps,\nconformality, winding numbers, flows — over 500 hand-drawn figures.\nIntuition-first rather than rigorous. Superb alongside\nStein–Shakarchi."}, "needham-visual-differential-geometry": {"label": "Needham, Visual Differential Geometry and Forms", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "differential-geometry-classical", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: Needham. Curvature, parallel transport, Gauss–Bonnet, and\ndifferential forms explained geometrically in \"five acts\", with\nhundreds of figures. The intuition pump the differential-geometry\ntrack is for; skim alongside do Carmo or Lee."}, "neukirch-algebraic-number-theory": {"label": "Neukirch, Algebraic Number Theory", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebraic-number-theory", "prereqs": ["algebra-basic", "galois-theory"], "detail": "", "notes": "Author: Neukirch. Graduate standard. Geometric, arithmetic, and\nanalytic perspectives woven together; local fields and class field\ntheory in depth. Dense — a second book after Marcus or Stewart–Tall,\nand the reference to return to on the Langlands arc."}, "nicolaescu-geometry-of-manifolds-notes": {"label": "Nicolaescu, Lectures on the Geometry of Manifolds (notes)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://www3.nd.edu/~lnicolae/Lectures.pdf", "course": "riemannian-geometry", "prereqs": ["smooth-manifolds"], "detail": "", "notes": "Author: Liviu Nicolaescu (revised 2026, 700 pages). Calculus on\nmanifolds, Riemannian geometry, Chern–Weil, Hodge theory, elliptic\nand Dirac operators. Many worked examples; too long to read through —\ndip into chosen chapters after Lee or Tu."}, "niven-zuckerman-montgomery": {"label": "Niven, Zuckerman, Montgomery — An Introduction to the Theory of Numbers", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "number-theory-basic", "prereqs": [], "detail": "", "notes": "Authors: Niven, Zuckerman, Montgomery. Standard advanced-undergrad\nelementary number theory: divisibility, congruences, quadratic\nreciprocity, Diophantine equations, continued fractions, some analytic\nNT. Heavy exercises."}, "petersen-riemannian-geometry": {"label": "Petersen, Riemannian Geometry", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "riemannian-geometry", "prereqs": ["smooth-manifolds"], "detail": "", "notes": "Author: Petersen. Graduate Riemannian geometry with an entire\nchapter of nontrivial examples. Complements do Carmo and Lee;\nstronger on comparison geometry."}, "pinter-book-of-abstract-algebra": {"label": "Pinter, A Book of Abstract Algebra", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": true, "medium": "book", "url": "", "course": "algebra-basic", "prereqs": [], "detail": "", "notes": "Author: Charles Pinter. 33 short chapters, each a conversational\nessay on one idea followed by a long themed exercise set that carries\nthe theory forward — groups, rings, fields, up to Galois theory. Most\nexercises are proofs, not drill. Self-contained and cheap (Dover). The\nmost problem-driven first pass at abstract algebra, before or instead\nof Artin."}, "polya-mathematics-plausible-reasoning": {"label": "Pólya, Mathematics and Plausible Reasoning", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "hungarian", "problems": false, "medium": "book", "url": "", "course": "mathematical-panorama", "prereqs": [], "detail": "", "notes": "Author: George Pólya. Two volumes (*Induction and Analogy*, *Patterns\nof Plausible Inference*) on how mathematicians guess: generalization,\nspecialization, analogy, through Euler's sums and isoperimetric\nproblems. Exercises with solutions. The heuristic companion to\nPólya–Szegő; dip in when stuck."}, "polya-szego-problems-theorems-analysis-1": {"label": "Pólya & Szegő, Problems and Theorems in Analysis I", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "hungarian", "problems": true, "medium": "book", "url": "", "course": "analysis-advanced", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Authors: Pólya, Szegő (Hungarian school). Series, integral calculus,\ninequalities, and function theory as sequences of problems in which\neach builds on the last, with full solutions. Legendary; a model of\nteaching theory through problems. Dip in for chapters at a time."}, "prasolov-combinatorial-differential-topology": {"label": "Prasolov, Elements of Combinatorial and Differential Topology", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": true, "medium": "book", "url": "", "course": "algebraic-topology", "prereqs": ["point-set-topology"], "detail": "", "notes": "Author: V. V. Prasolov (Independent University of Moscow). Graphs,\ntopology of Rⁿ (Jordan, Borsuk–Ulam), surfaces, coverings and\nbundles, smooth manifolds, fundamental groups; the sequel *Elements\nof Homology Theory* continues to homology and characteristic classes.\nGeometric, full of striking concrete results and problems with hints\nor solutions. A problem source next to Hatcher and Viro."}, "prasolov-sossinsky-knots-links-braids": {"label": "Prasolov & Sossinsky, Knots, Links, Braids and 3-Manifolds", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "low-dimensional-topology", "prereqs": ["algebraic-topology"], "detail": "", "notes": "Authors: Prasolov, Sossinsky. Knot and link invariants (Jones,\nVassiliev), braids, surface homeomorphisms, Kirby calculus, surgery,\nbranched coverings, skein invariants of 3-manifolds. Geometric Moscow\nwriting with exercises; dense in places."}, "pugh-real-mathematical-analysis": {"label": "Pugh, Real Mathematical Analysis", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "analysis-advanced", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: Pugh. Metric-space topology, multivariable calculus,\nLebesgue theory — the same ground as Tao II with lots of pictures and\na famously large, varied exercise set. Opinionated and geometric.\nAlternative to Tao II for [[analysis-advanced]]."}, "reed-simon-functional-analysis": {"label": "Reed & Simon, Methods of Modern Mathematical Physics I: Functional Analysis", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "functional-analysis", "prereqs": ["analysis-advanced", "linear-algebra-basic"], "detail": "", "notes": "Authors: Reed, Simon. Classic graduate functional analysis with a\nphysics flavor. Bounded operators, spectral theorem, compact\noperators, distributions. Thorough and mathematically rigorous."}, "reid-undergraduate-algebraic-geometry": {"label": "Reid, Undergraduate Algebraic Geometry", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebraic-geometry-classical", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Miles Reid. About 130 pages: conics, cubics, the\nNullstellensatz, varieties, the 27 lines on a cubic surface, and an\nopinionated history of the subject. Witty, concrete, exercised. A\nfast first pass at [[algebraic-geometry-classical]]."}, "reid-undergraduate-commutative-algebra": {"label": "Reid, Undergraduate Commutative Algebra", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "commutative-algebra-basic", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Miles Reid. Short, opinionated, geometric commutative\nalgebra: Noetherian rings, Nullstellensatz, localization, dimension,\nwith the motivation Atiyah–Macdonald leaves out. Exercised. A\nnarrative alternative for [[commutative-algebra-basic]]."}, "richter-gebert-projective-geometry": {"label": "Richter-Gebert, Perspectives on Projective Geometry", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "projective-geometry", "prereqs": ["linear-algebra-basic"], "detail": "", "notes": "Author: Jürgen Richter-Gebert. *A Guided Tour Through Real and\nComplex Geometry.* The projective plane, cross-ratios, conics,\nCayley–Klein construction of Euclidean, hyperbolic, and elliptic\ngeometry, circles via complex numbers, incidence theorems via bracket\nalgebra. Leisurely, hundreds of illustrations, concrete computations.\nBuilds projective intuition before algebraic geometry."}, "riehl-category-theory-in-context": {"label": "Riehl, Category Theory in Context", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "category-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Riehl. Graduate introduction grounded in examples drawn\nfrom algebra, topology, and analysis. Clear, exercised, narrative.\nGood pairing with Leinster as a deeper follow-up."}, "rodriguez-mit-functional-analysis-videos": {"label": "Rodriguez, MIT 18.102 Functional Analysis (video lectures)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PLUl4u3cNGP63micsJp_--fRAjZXPrQzW_", "course": "functional-analysis", "prereqs": ["measure-theory"], "detail": "", "notes": "Lecturer: Casey Rodriguez (MIT, Spring 2021). 23 lectures with problem\nsets on OCW: normed spaces, Lebesgue integration, Hilbert spaces,\ncompact operators, spectral theory. A complete course; pairs with\nMacCluer."}, "rodriguez-mit-real-analysis-videos": {"label": "Rodriguez, MIT 18.100A Real Analysis (video lectures)", "status": "open", "covered": true, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PLUl4u3cNGP61O7HkcF7UImpM0cR_L2gSw", "course": "analysis-foundations", "prereqs": [], "detail": "", "notes": "Lecturer: Casey Rodriguez (MIT, Fall 2020). 25 lectures with problem\nsets and exams on OCW: reals, sequences, series, continuity,\ndifferentiation, Riemann integration, uniform convergence. Material\nyou finished with Tao I — useful for review."}, "rotman-homological-algebra": {"label": "Rotman, An Introduction to Homological Algebra", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "homological-algebra", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Rotman. Narrative and example-rich introduction to\nhomological algebra — complexes, derived functors, Ext, Tor,\nspectral sequences. Gentler than Weibel."}, "rudin-principles-mathematical-analysis": {"label": "Rudin, Principles of Mathematical Analysis", "status": "open", "covered": true, "skimmed": true, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "analysis-foundations", "prereqs": [], "detail": "alongside Tao I", "notes": "Author: Rudin. \"Baby Rudin\": the classic terse single- and\nmultivariable analysis text, with hard, well-known exercises. Elegant\nbut unmotivated, so a poor primary text for this reader's taste.\nWorth reading next to a more narrative book to see the standard\nproofs stated compactly."}, "schuller-geometric-anatomy-videos": {"label": "Schuller, Lectures on the Geometric Anatomy of Theoretical Physics (video lectures)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PLPH7f_7ZlzxTi6kS4vCmv4ZKm9u8g5yic", "course": "smooth-manifolds", "prereqs": ["linear-algebra-basic", "analysis-foundations"], "detail": "", "notes": "Lecturer: Frederic Schuller (Erlangen, 2013–14). 28 lectures from\nlogic and sets through topology, manifolds, tensors, de Rham\ncohomology, Lie groups and algebras, fibre bundles, connections.\nUnusually precise yet motivated; community notes exist. The ideal\ncompanion to Lee or Tu; later lectures preview Lie theory and\ncharacteristic classes."}, "schuller-gravity-light-videos": {"label": "Schuller, Gravity and Light (video lectures)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PLFeEvEPtX_0S6vxxiiNPrJbLu9aK1UVC_", "course": "riemannian-geometry", "prereqs": ["smooth-manifolds"], "detail": "", "notes": "Lecturer: Frederic Schuller (Heraeus Winter School, 2015). 24 lectures:\nmanifolds, multilinear algebra, tangent spaces, connections, parallel\ntransport, curvature, Einstein gravity. Physics supplies the \"why\"\nfor connections and curvature — the differential track's intuition\npump. Watch alongside Lee's *Riemannian Manifolds*."}, "serre-course-in-arithmetic": {"label": "Serre, A Course in Arithmetic", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "modular-forms", "prereqs": ["algebra-basic", "complex-analysis"], "detail": "", "notes": "Author: Serre. Finite fields, p-adics, quadratic forms and\nHasse–Minkowski, Dirichlet's theorem, then modular forms for SL(2,Z)\n— in about 100 pages. The model of terse elegance; everything you\nalready half-know from elsewhere, stated perfectly.\nLean: blueprint project https://github.com/are4c4/SerreNumberTheoryBlueprint (status unclear)."}, "serre-linear-representations": {"label": "Serre, Linear Representations of Finite Groups", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "representation-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Serre. Part I is a 30-page model of how to present\ncharacter theory; later parts cover induction, Brauer theory, and\nrationality. Skim alongside James–Liebeck."}, "shafarevich-basic-algebraic-geometry-1": {"label": "Shafarevich, Basic Algebraic Geometry 1", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "algebraic-geometry-classical", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Shafarevich. *Varieties in Projective Space.* Classical\nalgebraic geometry — local structure, divisors, differential forms,\nintersection numbers, curves and surfaces — built on examples, with\nthe algebra introduced as needed. More geometric in feel than Western\ntreatments. Volume 2 covers schemes."}, "shafarevich-basic-notions-algebra": {"label": "Shafarevich, Basic Notions of Algebra", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "algebra-basic", "prereqs": ["linear-algebra-basic"], "detail": "", "notes": "Author: Shafarevich. A panoramic survey: what groups, rings,\nfields, modules, Lie groups, and categories are *for*, with examples\nfrom geometry, number theory, and physics, and almost no proofs.\nRead it for the map of algebra, before or alongside a textbook."}, "shen-vereshchagin-basic-set-theory": {"label": "Shen & Vereshchagin, Basic Set Theory", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "russian", "problems": true, "medium": "book", "url": "", "course": "set-theory-basic", "prereqs": [], "detail": "", "notes": "Authors: Shen, Vereshchagin (Moscow State lectures). Cardinalities,\nCantor–Bernstein, the diagonal method, well-orders, transfinite\ninduction, ordinals, Zorn and Zermelo, Hamel bases — developed through\n150+ interleaved problems in the Moscow math-circle style. Short and\nfun; a better first book for this reader than Halmos, and Mathlib has\n`Cardinal` and `Ordinal` to formalize against."}, "shen-vereshchagin-computable-functions": {"label": "Shen & Vereshchagin, Computable Functions", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "russian", "problems": true, "medium": "book", "url": "", "course": "computability", "prereqs": [], "detail": "", "notes": "Authors: Shen, Vereshchagin. Computable and enumerable sets,\nuniversal functions, numberings, the fixed-point theorem,\nreducibilities, oracles, the arithmetical hierarchy, Turing machines.\nTerse but problem-driven in the Moscow style. Companion volume to\ntheir *Basic Set Theory*; Mathlib's `Computability` gives a target."}, "shifrin-differential-geometry-notes": {"label": "Shifrin, Differential Geometry: A First Course in Curves and Surfaces (notes)", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "notes", "url": "https://math.franklin.uga.edu/sites/default/files/inline-files/ShifrinDiffGeo.pdf", "course": "differential-geometry-classical", "prereqs": ["analysis-foundations", "linear-algebra-basic"], "detail": "", "notes": "Author: Theodore Shifrin. Curves and the Frenet frame, global curve\ntheory, fundamental forms, Gauss map, Theorema Egregium, geodesics,\nGauss–Bonnet, hyperbolic geometry, in 128 pages with 16 substantial\nexercise sections. A free, more motivated counterpart to do Carmo."}, "shiryaev-probability": {"label": "Shiryaev, Probability", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "probability-basic", "prereqs": ["analysis-advanced"], "detail": "", "notes": "Author: A. N. Shiryaev, student of Kolmogorov. From elementary\nprobability with finite sample spaces up through Kolmogorov's\naxioms, martingales, Markov chains, and stationary sequences. Rigorous\nand encyclopedic but full of examples; skim for the Kolmogorov\nschool's view of the subject."}, "silverman-arithmetic-elliptic-curves": {"label": "Silverman, The Arithmetic of Elliptic Curves", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "elliptic-curves", "prereqs": ["commutative-algebra-basic", "algebraic-number-theory"], "detail": "", "notes": "Author: Silverman. Example-rich introduction to elliptic curves over\nvarious fields. A landmark on the path toward arithmetic geometry."}, "silverman-tate-rational-points": {"label": "Silverman & Tate, Rational Points on Elliptic Curves", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "elliptic-curves", "prereqs": ["algebra-basic"], "detail": "", "notes": "Authors: Silverman, Tate. Undergraduate elliptic curves — group law,\nMordell's theorem, points over finite fields, complex multiplication —\nwith only basic algebra. Example-first and exercised; the gentle\nentry before Silverman's *Arithmetic of Elliptic Curves*."}, "skopenkov-mathematics-via-problems-algebra": {"label": "Skopenkov, Mathematics via Problems: Part 1: Algebra", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": true, "medium": "book", "url": "", "course": "galois-theory", "prereqs": [], "detail": "", "notes": "Author: Arkadiy Skopenkov (MSRI Mathematical Circles Library).\nClassical algebra built purely through chained problems with hints and\nsolutions: divisibility, arithmetic mod p, polynomials, complex\nnumbers, permutations, up to solvability in radicals. Math-circle\nlevel, so it builds intuition rather than the field-extension\nmachinery later books assume. Short precise statements, ideal for Lean."}, "spivak-calculus-on-manifolds": {"label": "Spivak, Calculus on Manifolds", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "analysis-advanced", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: Spivak. About 140 pages: derivatives, integration, forms,\nand Stokes's theorem on manifolds in Rⁿ. Famously terse — Hubbard\ncovers the same ground with explanations. Skim for the compact\nversion."}, "stanley-enumerative-combinatorics-1": {"lab
