el": "Stanley, Enumerative Combinatorics (Volume 1)", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "enumerative-combinatorics", "prereqs": ["linear-algebra-basic", "algebra-basic"], "detail": "", "notes": "Author: Stanley. Graduate-level enumerative combinatorics: sieve,\nposets and lattices, rational generating functions. Dense, proof-\ncentric, landmark reference."}, "steele-cauchy-schwarz-master-class": {"label": "Steele, The Cauchy-Schwarz Master Class", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": true, "medium": "book", "url": "", "course": "inequalities", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: J. Michael Steele. *An Introduction to the Art of Mathematical\nInequalities.* Cauchy–Schwarz, AM-GM, Jensen and convexity, Hölder,\nHilbert's and Hardy's inequalities, majorization. The whole book is a\nguided tour of discovering proofs through challenge problems, all\nsolved. Short, concrete, finite — ideal Lean material."}, "steen-seebach-counterexamples-topology": {"label": "Steen & Seebach, Counterexamples in Topology", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "point-set-topology", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Authors: Steen, Seebach. 143 topological spaces catalogued against\nseparation, compactness, and connectedness properties. A browsing\nbook: look up the space that breaks the theorem you just learned."}, "stein-shakarchi-complex-analysis": {"label": "Stein & Shakarchi, Complex Analysis", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "complex-analysis", "prereqs": ["analysis-advanced"], "detail": "", "notes": "Authors: Stein, Shakarchi. Volume II of the Princeton Lectures in\nAnalysis. Motivated, proof-centric, strong on applications —\nFourier analysis, zeta function, theta functions. Well-exercised."}, "stein-shakarchi-fourier-analysis": {"label": "Stein & Shakarchi, Fourier Analysis: An Introduction", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "fourier-analysis", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Authors: Stein, Shakarchi. Volume I of the Princeton Lectures. Fourier\nseries (convergence, summability, kernels), the Fourier transform on\nR and Rᵈ with the heat and wave equations, finite Fourier analysis,\nending with a full proof of Dirichlet's theorem on primes in\nprogressions. Applications first; exercises plus harder problems.\nAvoids Lebesgue integration, so it can follow Tao I or II."}, "stein-shakarchi-real-analysis": {"label": "Stein & Shakarchi, Real Analysis", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "measure-theory", "prereqs": ["analysis-advanced"], "detail": "", "notes": "Authors: Stein, Shakarchi. Volume III of the Princeton Lectures in\nAnalysis. Measure theory, integration, Hilbert space, Hausdorff\nmeasure. Same narrative, example-first style as the Complex volume."}, "stewart-galois-theory": {"label": "Stewart, Galois Theory", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "galois-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Ian Stewart. Opens with the history (quadratics to Galois)\nand uses it to motivate every definition; field extensions, the\nGalois correspondence, solvability, constructions, finite fields.\nLots of worked examples and exercises. The most narrative option for\n[[galois-theory]]."}, "stewart-tall-algebraic-number-theory": {"label": "Stewart & Tall, Algebraic Number Theory and Fermat's Last Theorem", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebraic-number-theory", "prereqs": ["algebra-basic", "number-theory-basic"], "detail": "", "notes": "Authors: Stewart, Tall. Rings of integers, factorization of ideals,\nclass groups, units, Minkowski — organized around the story of\nFermat's Last Theorem, ending with an overview of Wiles's proof.\nGentler and more narrative than Marcus; exercised."}, "stillwell-elements-number-theory": {"label": "Stillwell, Elements of Number Theory", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "number-theory-basic", "prereqs": [], "detail": "", "notes": "Author: Stillwell. Elementary number theory told algebraically:\nEuclid, Pell's equation, Gaussian and quadratic integers, ideals,\nquadratic forms. Short chapters, historical commentary, good\nexercises. Points toward algebraic number theory rather than toward\nanalytic tricks, which suits the long-term arc."}, "stillwell-geometry-of-surfaces": {"label": "Stillwell, Geometry of Surfaces", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "low-dimensional-topology", "prereqs": ["point-set-topology", "algebra-basic"], "detail": "", "notes": "Author: Stillwell. Euclidean, spherical, and hyperbolic planes and\ntheir isometry groups, quotient surfaces, orbifolds, coverings, the\nfundamental group, hyperbolic surfaces and Poincaré's theorem.\nHistorical motivation, many figures, exercises in every section. Makes\ncovering spaces and group actions concrete before Hatcher chapter 1."}, "stillwell-mathematics-and-its-history": {"label": "Stillwell, Mathematics and Its History", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "mathematical-panorama", "prereqs": [], "detail": "", "notes": "Author: Stillwell. Mathematics told historically: Pythagoras, conics,\npolynomial equations, complex numbers, elliptic functions, Galois\ntheory, non-Euclidean geometry, topology, simple groups. Most sections\nend with exercise sequences that walk through real proofs. Previews\nthe arithmetic-geometry storyline; the purest motivated narrative."}, "stillwell-naive-lie-theory": {"label": "Stillwell, Naive Lie Theory", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "lie-theory", "prereqs": ["linear-algebra-basic", "analysis-foundations"], "detail": "", "notes": "Author: Stillwell. Lie theory through matrix groups — rotations,\nquaternions, SO(3), SU(2), the exponential map, tangent spaces,\nsimplicity — at an undergraduate level with historical asides and\nexercises. The gentle entry before Hall."}, "stillwell-reverse-mathematics": {"label": "Stillwell, Reverse Mathematics: Proofs from the Inside Out", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "logic-basic", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: Stillwell. For each basic theorem of analysis\n(Bolzano–Weierstrass, Heine–Borel, König's lemma) finds exactly which\naxiom it needs. Short, narrative, historical. Real analysis seen from\nthe foundations side, right after Tao."}, "stopple-primer-analytic-number-theory": {"label": "Stopple, A Primer of Analytic Number Theory", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "analytic-number-theory", "prereqs": ["analysis-foundations", "number-theory-basic"], "detail": "", "notes": "Author: Jeffrey Stopple. *From Pythagoras to Riemann.* Figurate\nnumbers, Euler's ζ(2), Bernoulli numbers, orders of arithmetic\nfunctions, the Riemann zeta function and explicit formula, a glimpse\nof L-functions and elliptic-curve L-functions. Historical, lively,\nnumerical experiments and exercises; careful with O-notation. Does not\nassume complex analysis."}, "strogatz-nonlinear-dynamics-chaos": {"label": "Strogatz, Nonlinear Dynamics and Chaos", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "ordinary-differential-equations", "prereqs": ["analysis-foundations", "linear-algebra-basic"], "detail": "", "notes": "Author: Strogatz. Flows on the line and circle, bifurcations, phase\nplane, limit cycles, Lorenz, chaos, maps, fractals. Geometric and\nexample-first with physics and biology applications and big exercise\nsets. Less rigorous than Arnold or Teschl; the intuition companion."}, "sutherland-elliptic-curves-notes": {"label": "Sutherland, Elliptic Curves (MIT 18.783 notes)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://math.mit.edu/classes/18.783/2023/lectures.html", "course": "elliptic-curves", "prereqs": ["galois-theory", "number-theory-basic"], "detail": "", "notes": "Author: Andrew Sutherland. Group law, isogenies, endomorphism rings,\nHasse's theorem, Schoof's algorithm, ordinary vs. supersingular, then\ncomplex multiplication, modular curves, Mordell–Weil. Concrete and\ncomputational, with problem sets. The computing side of Silverman."}, "sutherland-number-theory-notes": {"label": "Sutherland, Number Theory I (MIT 18.785 notes)", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "notes", "url": "https://math.mit.edu/classes/18.785/2021fa/lectures.html", "course": "algebraic-number-theory", "prereqs": ["commutative-algebra-basic", "galois-theory"], "detail": "", "notes": "Author: Andrew Sutherland. 28 lectures: absolute values, Dedekind\ndomains, étale algebras, Frobenius and the Artin map, local fields\nand Hensel, different and discriminant, geometry of numbers, units,\nzeta and L-functions, class number formula, Kronecker–Weber, class\nfield theory statements, adeles and ideles. Clean, example-rich, with\n11 problem sets. A modern free replacement for Neukirch that runs\nstraight into class field theory."}, "tao-analysis-1": {"label": "Tao, Analysis I", "status": "finished", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "analysis-foundations", "prereqs": [], "detail": "started 06'25, finished 06'26 — proof: https://github.com/rkirov/analysis", "notes": "Author: Tao. Construction of reals from naturals up; rigorous\nfoundations before calculus. Heavy exercises.\nLean: Tao's official companion (every exercise a `sorry`): https://github.com/teorth/analysis"}, "tao-analysis-2": {"label": "Tao, Analysis II", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "analysis-advanced", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: Tao. Metric spaces, multivariable calculus, Lebesgue integration."}, "tao-measure-theory": {"label": "Tao, An Introduction to Measure Theory", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "measure-theory", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: Tao. Jordan and Lebesgue measure built from elementary\nsets, abstract measure spaces, the convergence theorems, product\nmeasures, differentiation. Exercises embedded in the text, as in\n*Analysis I* — the same style you already finished."}, "teschl-ode-dynamical-systems": {"label": "Teschl, Ordinary Differential Equations and Dynamical Systems", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "https://www.mat.univie.ac.at/~gerald/ftp/book-ode/", "course": "ordinary-differential-equations", "prereqs": ["analysis-advanced", "linear-algebra-basic"], "detail": "", "notes": "Author: Teschl. Modern graduate ODE text, proof-centric, free\nonline. Covers linear systems, stability, boundary value problems,\ndynamical systems. Clean and thorough."}, "thurston-three-dimensional-geometry-topology": {"label": "Thurston, Three-Dimensional Geometry and Topology, Volume 1", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "low-dimensional-topology", "prereqs": ["algebraic-topology", "smooth-manifolds"], "detail": "", "notes": "Author: William Thurston, edited by Silvio Levy. Intuitive examples\nof 3-manifolds, hyperbolic geometry, (G,X)-structures, orbifolds, the\neight geometries. Picture-driven, with many exercises; teaches how to\n*think* geometrically, though some arguments are sketches. Skim after\nStillwell."}, "tokieda-topology-geometry-videos": {"label": "Tokieda, Topology & Geometry (video lectures, AIMS)", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PLTBqohhFNBE_09L0i-lf3fYXF5woAbrzJ", "course": "point-set-topology", "prereqs": [], "detail": "", "notes": "Lecturer: Tadashi Tokieda (AIMS South Africa, 2014). About 15\nlectures in 35 parts: an intuition-first tour of surfaces and their\ngeometry with hands-on demonstrations. Exceptionally motivating, in\nthe Arnold spirit; watch early, before or during point-set topology."}, "tong-general-relativity-notes": {"label": "Tong, General Relativity (lecture notes)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://www.damtp.cam.ac.uk/user/tong/gr.html", "course": "riemannian-geometry", "prereqs": ["smooth-manifolds"], "detail": "", "notes": "Author: David Tong (Cambridge Part III). Chapters on differential\ngeometry (forms, de Rham, Stokes) and Riemannian geometry (metrics,\nHodge star, connections, curvature), each motivated by geodesics and\nphysics. Famously clear; problem sheets online. The physics intuition\npump next to Lee's *Riemannian Manifolds*."}, "tu-differential-geometry": {"label": "Tu, Differential Geometry: Connections, Curvature, and Characteristic Classes", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "characteristic-classes", "prereqs": ["smooth-manifolds"], "detail": "", "notes": "Author: Tu. Sequel to *An Introduction to Manifolds*. Riemannian\nmanifolds and curvature, connections on vector and principal bundles,\nChern–Weil theory. Same gentle pacing and exercises as the first\nvolume. Covers the connections/curvature material from the\ndifferential-geometry track in one book."}, "tu-introduction-to-manifolds": {"label": "Tu, An Introduction to Manifolds", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "smooth-manifolds", "prereqs": ["analysis-advanced", "linear-algebra-basic", "point-set-topology"], "detail": "", "notes": "Author: Tu. Gentle advanced-undergrad / early-grad introduction to\nsmooth manifolds, differential forms, de Rham cohomology. Well-\nmotivated and carefully paced — often recommended as the step\nbefore Lee."}, "vakil-rising-sea": {"label": "Vakil, The Rising Sea: Foundations of Algebraic Geometry", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "https://math.stanford.edu/~vakil/216blog/", "course": "algebraic-geometry", "prereqs": ["algebra-basic", "commutative-algebra-basic"], "detail": "", "notes": "Author: Vakil. Schemes, sheaves, cohomology — Hartshorne's material\nwith far more motivation, pictures, and exercises (the exercises\n*are* the book). Teaches the category theory it needs in chapter 1.\nLong; built for cover-to-cover reading. Free online."}, "van-dalen-logic-and-structure": {"label": "van Dalen, Logic and Structure", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "logic-basic", "prereqs": [], "detail": "", "notes": "Author: van Dalen. European-style undergraduate-to-graduate logic\ntext. Propositional and first-order logic, completeness, models,\nintuitionistic logic. Narrative and exercised."}, "van-lint-wilson-combinatorics": {"label": "van Lint & Wilson, A Course in Combinatorics", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "combinatorics-basic", "prereqs": ["linear-algebra-basic"], "detail": "", "notes": "Authors: van Lint, Wilson. Broad advanced-undergrad survey: counting,\ngraph theory, designs, codes, Ramsey, generating functions. Proof-\ncentric, many exercises."}, "velleman-how-to-prove-it-lean": {"label": "Velleman, How To Prove It with Lean", "status": "open", "covered": true, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "https://djvelleman.github.io/HTPIwL/", "course": "formalization-lean", "prereqs": [], "detail": "", "notes": "Author: Velleman. The Lean 4 companion to *How to Prove It*, chapter by\nchapter: logic, quantifiers, proof strategies, sets, relations,\nfunctions, induction, cardinality, with a beginner-friendly tactic\npackage. A second angle next to Macbeth. Free online."}, "vinberg-course-in-algebra": {"label": "Vinberg, A Course in Algebra", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "algebra-basic", "prereqs": ["linear-algebra-basic"], "detail": "", "notes": "Author: E. B. Vinberg. Groups, rings, fields, modules, linear\nalgebra, and a first look at Lie groups and representations, taught\nwith the Moscow emphasis on examples, geometry, and symmetry. Many\nexercises. Could serve as a primary; listed here to skim for its\ndifferent organization next to Artin."}, "vinogradov-elements-number-theory": {"label": "Vinogradov, Elements of Number Theory", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": true, "medium": "book", "url": "", "course": "number-theory-basic", "prereqs": [], "detail": "", "notes": "Author: I. M. Vinogradov. Compact classic from the 1930s: divisibility,\ncongruences, primitive roots, characters. Each chapter is followed by\na large set of problems (with numerical exercises) that carry much of\nthe content. The Russian problem-driven style applied to elementary\nnumber theory."}, "viro-elementary-topology-problem-textbook": {"label": "Viro et al. — Elementary Topology Problem Textbook", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "russian", "problems": true, "medium": "book", "url": "https://www.pdmi.ras.ru/~olegviro/topoman/index.html", "course": "point-set-topology", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Authors: Viro, Ivanov, Netsvetaev, Kharlamov (St. Petersburg). Point-set\ntopology, then fundamental group and covering spaces, developed as a\nsequence of problems you prove yourself, with hints and solutions in\nthe back. Grew out of the St. Petersburg courses. A full course for\nsomeone who learns by doing problems; free online."}, "volkovyskii-problems-complex-analysis": {"label": "Volkovyskii, Lunts, Aramanovich — A Collection of Problems on Complex Analysis", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": true, "medium": "book", "url": "", "course": "complex-analysis", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Authors: Volkovyskii, Lunts, Aramanovich. Over 1,500 problems:\nconformal maps, harmonic functions, series, Cauchy and residue\ntheorems, Laurent series, infinite products, applications to\nhydrodynamics and electrostatics. Many are computational — choose\nrather than work through. Problem bank next to Stein–Shakarchi."}, "weibel-homological-algebra": {"label": "Weibel, An Introduction to Homological Algebra", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "homological-algebra", "prereqs": ["algebra-basic", "category-theory"], "detail": "", "notes": "Author: Weibel. Graduate standard reference. Comprehensive: derived\ncategories, group cohomology, simplicial methods. Assumes more\ncategory theory than Rotman. Look things up here after Rotman."}, "west-combinatorial-mathematics": {"label": "West, Combinatorial Mathematics", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "combinatorics-basic", "prereqs": ["linear-algebra-basic"], "detail": "", "notes": "Author: Doug West. Modern broad combinatorics: counting, bijective\narguments, generating functions, designs, posets, Ramsey, extremal,\nprobabilistic method. Thorough and heavily exercised in West's\ntrademark style."}, "west-introduction-to-graph-theory": {"label": "West, Introduction to Graph Theory", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "graph-theory", "prereqs": ["linear-algebra-basic"], "detail": "", "notes": "Author: Doug West. The standard advanced-undergrad graph theory\ntext. Trees, matchings, connectivity, coloring, planarity, Ramsey,\nextremal, algebraic and spectral. Proof-centric, heavy exercises,\nnarrative."}, "wildberger-algebraic-topology-videos": {"label": "Wildberger, Algebraic Topology: A Beginner's Course (video lectures)", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL41FDABC6AA085E78", "course": "algebraic-topology", "prereqs": [], "detail": "", "notes": "Lecturer: N. J. Wildberger (UNSW). 40 lectures: winding numbers,\nknots, classification of surfaces, Euler characteristic, links to\nspherical and hyperbolic geometry, first homology. Concrete,\nhistorical, picture-driven. Wildberger is a finitist and skips\npoint-set foundations; treat it as intuition, not foundations."}, "wilf-generatingfunctionology": {"label": "Wilf, generatingfunctionology", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "https://www2.math.upenn.edu/~wilf/DownldGF.html", "course": "enumerative-combinatorics", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: Wilf. Generating functions as the organizing idea of\nenumeration: formal power series, the exponential formula,\nasymptotics via analysis, the WZ method. Short, conversational, many\nexercises with solutions. Free online. The friendly entry to\n[[enumerative-combinatorics]] before Stanley."}, "williams-probability-martingales": {"label": "Williams, Probability with Martingales", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "probability-basic", "prereqs": ["analysis-advanced"], "detail": "", "notes": "Author: David Williams. Measure-theoretic probability in about 250\npages, built around martingales. Chatty, opinionated, with a large\nexercise chapter. Develops the measure theory it needs. A narrative\nalternative to Durrett."}, "zorich-mathematical-analysis-1": {"label": "Zorich, Mathematical Analysis I", "status": "open", "covered": true, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "analysis-foundations", "prereqs": [], "detail": "", "notes": "Author: V. A. Zorich. The Moscow State analysis course: real numbers,\nlimits, differential and integral calculus of one variable, then\nseveral variables. Thorough, with physical motivation, historical\nremarks, and problem sets. A different path through the material of\nTao I."}, "zorich-mathematical-analysis-2": {"label": "Zorich, Mathematical Analysis II", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "analysis-advanced", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Author: V. A. Zorich. Continues into multivariable integration,\ndifferential forms on manifolds, Stokes's theorem, series and\nintegrals depending on a parameter, Fourier analysis, asymptotics.\nMore geometric and physics-aware than Western analysis texts."}}, "finished": ["tao-analysis-1", "avigad-massot-mathematics-in-lean", "avigad-de-moura-theorem-proving-in-lean-4"], "reading": ["axler-linear-algebra", "lawvere-schanuel-conceptual-mathematics"], "skimmed": ["rudin-principles-mathematical-analysis", "bressoud-radical-approach-real-analysis"], "edges": [{"s": "linear-algebra-basic", "t": "algebra-basic", "all": false, "books": ["artin-algebra", "aluffi-chapter-zero", "gross-abstract-algebra-videos"]}, {"s": "commutative-algebra-basic", "t": "algebraic-geometry", "all": true, "books": ["vakil-rising-sea", "eisenbud-harris-geometry-of-schem // ---------- model ----------
const C = Object.fromEntries(D.courses.map(c => [c.id, c]));
const B = D.books;
const AREA_IDX = Object.fromEntries(D.areas.map((a, i) => [a.id, i]));
const sat = new Set(D.courses.filter(c => c.status === 'satisfied').map(c => c.id));

const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
function splitTitle(label) {
  const i = label.indexOf(' — '), j = label.indexOf(', ');
  const k = i >= 0 ? i : j;
  return k < 0 ? [label, ''] : [label.slice(0, k), label.slice(k + (i >= 0 ? 3 : 2))];
}
// Companion books are for skimming: shown in cards, ignored for structure.
const primaries = id => { const p = C[id].members.filter(b => !B[b].companion); return p.length ? p : C[id].members; };
const coursePre = id => [...new Set(primaries(id).flatMap(b => B[b].prereqs))];
const dependents = {};
D.courses.forEach(c => coursePre(c.id).forEach(p => (dependents[p] ??= []).push(c.id)));
function closure(starts, next) {
  const seen = new Set(), st = [...starts];
  while (st.length) for (const y of next(st.pop()) || []) if (!seen.has(y)) { seen.add(y); st.push(y); }
  return seen;
}
const ancestorsOf = ids => { const s = closure(ids, coursePre); ids.forEach(i => s.add(i)); return s; };
const descendantsOf = id => closure([id], x => dependents[x]);

// Cheapest set of unsatisfied courses needed to satisfy `c`, choosing one
// member book per course (a book being read always wins; ties go to the
// member listed first).
const needMemo = new Map();
function need(c) {
  if (needMemo.has(c)) return needMemo.get(c);
  let res;
  if (sat.has(c)) res = { set: new Set(), pick: C[c].members.find(b => B[b].status === 'finished') };
  else {
    for (const b of primaries(c)) {
      const s = new Set([c]);
      B[b].prereqs.forEach(p => need(p).set.forEach(x => s.add(x)));
      const score = B[b].status === 'reading' ? -1 : s.size;
      if (!res || score < res.score) res = { set: s, pick: b, score };
    }
  }
  needMemo.set(c, res);
  return res;
}
function routeFor(courseIds) {
  const s = new Set();
  courseIds.forEach(c => need(c).set.forEach(x => s.add(x)));
  return [...s].sort((a, b) => C[a].layer - C[b].layer || AREA_IDX[C[a].area] - AREA_IDX[C[b].area]);
}
const stepState = c => {
  const b = need(c).pick;
  if (B[b].status === 'reading') return 'active';
  return B[b].prereqs.every(p => sat.has(p)) ? 'ready' : 'later';
};
// Books that become startable once course `c` is satisfied.
function opens(c) {
  if (sat.has(c)) return [];
  return Object.keys(B).filter(b => B[b].status === 'locked' && !B[b].companion && B[b].prereqs.includes(c)
    && B[b].prereqs.every(p => p === c || sat.has(p)));
}

// ---------- layout ----------
const W = 272, HEAD = 38, ROW = 25, PADB = 9, COLGAP = 104, CELLGAP = 16, LANEPAD = 50, GUTTER = 176, RIGHTPAD = 60;
// Companions collapse into one "+N" row unless ?all is in the URL; ones
// you've touched (skimmed, reading, finished) always stay visible.
const SHOW_ALL = new URLSearchParams(location.search).has('all');
const shown = id => SHOW_ALL ? C[id].members
  : C[id].members.filter(b => !B[b].companion || B[b].skimmed || B[b].status === 'reading' || B[b].status === 'finished');
const hiddenCount = id => C[id].members.length - shown(id).length;
const cardH = id => HEAD + 4 + (shown(id).length + (hiddenCount(id) ? 1 : 0)) * ROW + PADB;
const maxLayer = Math.max(...D.courses.map(c => c.layer));
const pos = {};
const cells = {};
D.courses.forEach(c => (cells[`${c.area}|${c.layer}`] ??= []).push(c.id));
const rank = { satisfied: 0, active: 1, open: 2, locked: 3 };
const order = {};
for (let l = 0; l <= maxLayer; l++) {
  for (const a of D.areas) {
    const ids = cells[`${a.id}|${l}`] || [];
    const key = id => {
      const ps = coursePre(id).filter(p => C[p].layer < l);
      if (!ps.length) return rank[C[id].status];
      return 10 + ps.reduce((s, p) => s + AREA_IDX[C[p].area] * 100 + order[p], 0) / ps.length;
    };
    ids.sort((x, y) => key(x) - key(y) || x.localeCompare(y)).forEach((id, i) => { order[id] = i; });
  }
}
const laneY = {}, laneH = {};
let y = 0;
D.areas.forEach(a => {
  let h = 0;
  for (let l = 0; l <= maxLayer; l++) {
    const ids = cells[`${a.id}|${l}`] || [];
    const hh = ids.reduce((s, id) => s + cardH(id), 0) + Math.max(0, ids.length - 1) * CELLGAP;
    h = Math.max(h, hh);
  }
  laneY[a.id] = y; laneH[a.id] = h + LANEPAD + 26;
  y += laneH[a.id];
});
const WORLD_W = GUTTER + (maxLayer + 1) * (W + COLGAP) - COLGAP + RIGHTPAD;
const WORLD_H = y;
for (const [key, ids] of Object.entries(cells)) {
  const [a, l] = key.split('|');
  let cy = laneY[a] + LANEPAD;
  ids.forEach(id => { pos[id] = { x: GUTTER + +l * (W + COLGAP), y: cy, h: cardH(id) }; cy += cardH(id) + CELLGAP; });
}

svg.setAttribute('width', WORLD_W); svg.setAttribute('height', WORLD_H);

let html = '';
D.areas.forEach((a, i) => {

    + `<div class="lane-label">${esc(a.label)}</div></div>`;
});
for (let l = 0; l <= maxLayer; l++) {
  html += `<div class="stage-label" style="left:${GUTTER + l * (W + COLGAP) + 2}px">${l === 0 ? 'No prerequisites' : 'Stage ' + (l + 1)}</div>`;
}
const MATHLIB = {
  strong: 'strong — most definitions and main theorems exist',

  native: 'native — this is what Lean is',

// One short label per row, most informative first.
const tagFor = bk => bk.skimmed ? '' : bk.problems ? 'problems' : bk.medium !== 'book' ? bk.medium : bk.companion ? 'skim' : '';
const STATUS_WORD = { satisfied: 'done', active: 'in progress', open: 'open', locked: 'locked' };
for (const c of D.courses) {
  const p = pos[c.id];
  const badges = (c.goal ? '<span class="badge" title="Goal (preferences.md)">goal</span>' : '')
    + (c.focus ? '<span class="badge" title="Current focus (preferences.md)">focus</span>' : '');
  html += `<div class="card s-${c.status}" data-course="${c.id}" style="left:${p.x}px;top:${p.y}px;width:${W}px;height:${p.h}px">`
    + `<div class="head" title="${esc(c.label)} — ${STATUS_WORD[c.status]}"><span class="title">${esc(c.label)}</span>${badges}</div>`;
  for (const b of shown(c.id)) {
    const bk = B[b], [who, what] = splitTitle(bk.label);
    const tip = bk.label + (bk.status === 'locked' ? ' — needs ' + bk.prereqs.filter(x => !sat.has(x)).map(x => C[x].label).join(', ') : '');
    const tip2 = tip + (bk.medium !== 'book' ? ` — ${bk.medium === 'video' ? 'video lectures' : 'lecture notes'}` : '')
      + (bk.skimmed ? ' — skimmed' : bk.problems ? ' — problem book' : bk.companion ? ' — companion' : '')
      + (bk.tradition ? ` — ${bk.tradition} school` : '');
    const tagText = tagFor(bk);
    html += `<div class="row st-${bk.status}${bk.covered ? ' covered' : ''}${bk.skimmed ? ' skimmed' : ''}${bk.companion ? ' companion' : ''}" data-book="${b}" title="${esc(tip2)}">`
      + `<i class="dot"></i><span class="who">${esc(who)}</span><span class="what">${esc(what)}</span>${tagText ? `<span class="tag${bk.problems ? ' prob' : ''}">${tagText}</span>` : ''}`
      + (bk.url ? `<a class="ext" href="${esc(bk.url)}" target="_blank" rel="noopener" title="Open ${esc(bk.url)}">↗</a>` : '') + '</div>';
  }
  const hid = hiddenCount(c.id);
  if (hid) html += `<div class="row more" title="Open the course to see them, or show all with the ☰ button">+ ${hid} companion${hid === 1 ? '' : 's'} to skim or watch</div>`;
  html += '</div>';
}
world.insertAdjacentHTML('beforeend', html);

const cardEl = {}, rowEl = {};
world.querySelectorAll('.card').forEach(el => { cardEl[el.dataset.course] = el; });
world.querySelectorAll('.row').forEach(el => { rowEl[el.dataset.book] = el; });

const edgeEls = [];
const NS = 'http://www.w3.org/2000/svg';
for (const e of D.edges) {
  const s = pos[e.s], t = pos[e.t];
  const sx = s.x + W, sy = s.y + HEAD / 2;
  const targets = e.all ? [t.y + HEAD / 2]
    : e.books.map(b => t.y + HEAD + 4 + shown(e.t).indexOf(b) * ROW + ROW / 2);
  for (const ty of targets) {
    let d;
    if (s.x < t.x) {
      // forward: right edge of source → left edge of target
      const tx = t.x - 2, dx = Math.max(48, (tx - sx) * 0.45);
      d = `M${sx},${sy} C${sx + dx},${sy} ${tx - dx},${ty} ${tx},${ty}`;
    } else if (s.x === t.x) {
      // same column (only a partial prereq can do this): bracket on the right
      const tx = t.x + W + 2, bulge = 34 + Math.min(40, Math.abs(ty - sy) * 0.06);
      d = `M${sx},${sy} C${sx + bulge},${sy} ${tx + bulge},${ty} ${tx},${ty}`;
    } else {
      // source is in a later column: left edge of source → right end of the book row
      const x0 = s.x, tx = t.x + W + 2, dx = Math.max(30, (x0 - tx) * 0.45);
      d = `M${x0},${sy} C${x0 - dx},${sy} ${tx + dx},${ty} ${tx},${ty}`;
    }
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'e' + (e.all ? '' : ' partial'));
    svg.appendChild(path);
    edgeEls.push({ el: path, s: e.s, t: e.t });
  }
}

// ---------- highlight ----------
let selection = null; // {kind:'course'|'book', id}
function applyHighlight() {
  world.querySelectorAll('.sel,.anc,.desc,.route').forEach(el => el.classList.remove('sel', 'anc', 'desc', 'route'));
  edgeEls.forEach(e => e.el.classList.remove('up', 'down'));
  world.classList.toggle('has-sel', !!selection);
  if (!selection) return;
  let courseId, up, route;
  if (selection.kind === 'course') {
    courseId = selection.id;
    up = ancestorsOf([courseId]);
    route = new Set(routeFor([courseId]));
  } else {
    const b = B[selection.id];
    courseId = b.course;
    up = ancestorsOf(b.prereqs); up.add(courseId);
    route = new Set(routeFor(b.prereqs));
    rowEl[selection.id]?.classList.add('sel'); // collapsed companions have no row
  }
  const down = descendantsOf(courseId); down.add(courseId);
  up.forEach(id => cardEl[id].classList.add('anc'));
  down.forEach(id => cardEl[id].classList.add('desc'));
  route.forEach(id => { if (id !== courseId) cardEl[id].classList.add('route'); });
  cardEl[courseId].classList.add('sel');
  for (const e of edgeEls) {
    if (up.has(e.s) && up.has(e.t)) e.el.classList.add('up');
    else if (down.has(e.s) && down.has(e.t)) e.el.classList.add('down');
  }
}
world.addEventListener('pointerover', ev => {
  const card = ev.target.closest('.card');
  edgeEls.forEach(e => e.el.classList.toggle('hl', !!card && !selection && (e.s === card.dataset.course || e.t === card.dataset.course)));
});
world.addEventListener('pointerleave', () => edgeEls.forEach(e => e.el.classList.remove('hl')));

// ---------- pan / zoom ----------
const stage = document.getElementById('stage');
const view = { x: 0, y: 0, k: 1 };
const applyView = () => { world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; };
const clampK = k => Math.min(2, Math.max(0.15, k));
function zoomAt(px, py, factor) {
  const k = clampK(view.k * factor);
  view.x = px - (px - view.x) * (k / view.k);
  view.y = py - (py - view.y) * (k / view.k);
  view.k = k; applyView();
}
let anim = null;
function animateTo(target, ms = 280) {
  cancelAnimationFrame(anim);
  const from = { ...view }, t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - t, 3);
    view.x = from.x + (target.x - from.x) * e; view.y = from.y + (target.y - from.y) * e; view.k = from.k + (target.k - from.k) * e;
    applyView();
    if (t < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
function fitView(animated) {
  const r = stage.getBoundingClientRect();
  const k = clampK(Math.min((r.width - 20) / WORLD_W, (r.height - 70) / WORLD_H));
  const target = { k, x: (r.width - WORLD_W * k) / 2, y: 60 };
  animated ? animateTo(target) : (Object.assign(view, target), applyView());
}
function centerOn(courseId) {
  const r = stage.getBoundingClientRect(), p = pos[courseId];
  const k = Math.max(view.k, 0.75);
  const cx = p.x + W / 2, cy = p.y + p.h / 2;
  const vx = (cx * view.k + view.x), vy = (cy * view.k + view.y);
  const margin = 60;
  if (k === view.k && vx > margin && vx < r.width - margin && vy > margin + 40 && vy < r.height - margin) return;
  animateTo({ k, x: r.width / 2 - cx * k, y: r.height / 2 - cy * k });
}

stage.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = stage.getBoundingClientRect();
  if (ev.ctrlKey || ev.metaKey) zoomAt(ev.clientX - r.left, ev.clientY - r.top, Math.exp(-ev.deltaY * 0.01));
  else { view.x -= ev.deltaX; view.y -= ev.deltaY; applyView(); }
}, { passive: false });

const pointers = new Map();
let drag = null, pinch = null;
stage.addEventListener('pointerdown', ev => {
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  stage.setPointerCapture(ev.pointerId);
  if (pointers.size === 1) drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y, moved: false, target: ev.target };
  else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k };
    drag = null;
  }
});
stage.addEventListener('pointermove', ev => {
  if (!pointers.has(ev.pointerId)) return;
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()], r = stage.getBoundingClientRect();
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, (pinch.k * d / pinch.d) / view.k);
  } else if (drag) {
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; stage.classList.add('dragging'); }
    if (drag.moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(); }
  }
});
const endPointer = ev => {
  pointers.delete(ev.pointerId);
  if (pointers.size < 2) pinch = null;
  if (drag && ev.type === 'pointerup' && !drag.moved && drag.target.closest?.('a.ext')) {
    window.open(drag.target.closest('a.ext').href, '_blank', 'noopener');
  } else if (drag && ev.type === 'pointerup' && !drag.moved) {
    const row = drag.target.closest?.('.row[data-book]'), card = drag.target.closest?.('.card');
    if (row) select('book', row.dataset.book);
    else if (card) select('course', card.dataset.course);
    else select(null);
  }
  drag = null; stage.classList.remove('dragging');
};
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
const zoomCenter = f => { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, f); };
document.getElementById('zin').onclick = () => zoomCenter(1.25);
document.getElementById('zout').onclick = () => zoomCenter(0.8);
document.getElementById('fit').onclick = () => fitView(true);
document.getElementById('all').onclick = () => {
  const u = new URL(location.href);
  SHOW_ALL ? u.searchParams.delete('all') : u.searchParams.set('all', '');
  location.href = u.toString().replace('all=', 'all');
};
if (SHOW_ALL) document.getElementById('all').style.borderColor = 'var(--open)';

// ---------- panel ----------
const panel = document.getElementById('panel');
const dot = st => `<i class="dot st-${st}"></i>`;
const cDot = c => dot({ satisfied: 'finished', active: 'reading', open: 'open', locked: 'locked' }[C[c].status]);
const courseChip = c => `<span class="chip" data-go="course:${c}">${cDot(c)}${esc(C[c].label)}</span>`;
const bookShort = b => splitTitle(B[b].label)[0];
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function linkify(text) {
  return esc(text).replace(/https?:\/\/[^\s)]+/g, u => {
    const short = u.replace(/^https?:\/\/(www\.)?/, '').replace(/^github\.com\//, '');
    return `<a href="${u}" target="_blank" rel="noopener">${short}</a>`;
  });
}
function renderNotes(md) {
  return md.split(/\n\s*\n/).map(par => '<p>' + esc(par.replace(/\n/g, ' '))
    .replace(/\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/g, (m, id, alias) => {
      const kind = C[id] ? 'course' : B[id] ? 'book' : null;
      if (!kind) return esc(alias || id);
      return `<span class="chip inline" data-go="${kind}:${id}">${esc(alias || (C[id] || B[id]).label)}</span>`;
    })
    .replace(/`([^`]+)`/g, (m, id) => C[id] ? `<span class="chip inline" data-go="course:${id}">${esc(C[id].label)}</span>` : `<code>${id}</code>`)
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/(https?:\/\/[^\s<]+[^\s<.,;:)])|\b(PL[0-9A-Za-z_-]{20,})\b/g, (m, url, pl) => {
      const href = url || `https://www.youtube.com/playlist?list=${pl}`;
      const text = url ? url.replace(/^https?:\/\/(www\.)?/, '') : 'playlist ↗';
      return `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
    }) + '</p>').join('');
}
function routeSteps(route) {
  return `<div class="steps">${route.map(c => {
    const st = stepState(c);
    return `<span class="step ${st}" data-go="course:${c}" title="via ${esc(B[need(c).pick].label)}">${esc(C[c].label)}</span>`;
  }).join('')}</div>`;
}
function routeList(route) {
  return route.map((c, i) => {
    const b = need(c).pick, st = stepState(c);
    const note = st === 'active' ? 'reading now' : st === 'ready' ? 'can start now' : 'needs ' + B[b].prereqs.filter(p => !sat.has(p)).map(p => C[p].label).join(', ');
    return `<div class="item${st === 'later' ? ' dimmed' : ''}" data-go="book:${b}"><span class="n stat">${i + 1}.</span>`
      + `<div class="main"><div class="t">${esc(C[c].label)}</div><div class="d">${esc(B[b].label)} · ${esc(note)}</div></div></div>`;
  }).join('');
}

function renderHome() {
  const nFinished = D.finished.length, nBooks = Object.keys(B).length;
  let h = `<h1>mathmap</h1><div class="sub stat">${nFinished} of ${nBooks} books finished · ${sat.size} of ${D.courses.length} courses done</div>`;

  if (D.reading.length) {
    h += '<h3>Reading now</h3>';
    for (const b of D.reading) {
      const c = B[b].course, o = opens(c);
      const bits = [];
      if (B[b].detail) bits.push(linkify(B[b].detail));
      if (c) bits.push(`${esc(C[c].label)}${o.length ? ` · finishing opens ${plural(o.length, 'book')}` : ''}`);
      h += `<div class="now" data-go="book:${b}"><div class="t">${esc(B[b].label)}</div><div class="d">${bits.join('<br>')}</div></div>`;
    }
  }

  const next = D.courses.filter(c => c.status === 'open')
    .map(c => ({ c: c.id, n: opens(c.id).length }))
    .sort((x, y) => C[y.c].focus - C[x.c].focus || y.n - x.n || C[x.c].label.localeCompare(C[y.c].label));
  if (next.length) {
    h += '<h3>Could start now</h3>';
    for (const { c, n } of next) {
      const books = primaries(c).filter(b => B[b].status === 'open').map(bookShort);
      h += `<div class="item" data-go="course:${c}">${dot('open')}<div class="main"><div class="t">${esc(C[c].label)}${C[c].focus ? ' <span class="sub" style="font-weight:400">· focus</span>' : ''}</div>`
        + `<div class="d">${books.map(esc).join(' · ')}</div></div><span class="n stat" title="books that become startable">${n ? 'opens ' + n : ''}</span></div>`;
    }
  }

  const skim = Object.keys(B).filter(b => B[b].companion && B[b].status === 'open' && !B[b].skimmed)
    .sort((x, y) => C[B[x].course].layer - C[B[y].course].layer || AREA_IDX[C[B[x].course].area] - AREA_IDX[C[B[y].course].area]);
  if (skim.length) {
    h += '<h3>Companions ready now</h3>';
    for (const b of skim) {
      const tagText = tagFor(B[b]);
      h += `<div class="item" data-go="book:${b}">${dot('open')}<div class="main"><div class="t">${esc(B[b].label)}</div>`
        + `<div class="d">${esc(C[B[b].course].label)}${B[b].tradition ? ' · ' + esc(B[b].tradition) + ' school' : ''}</div></div>`
        + `<span class="tag${B[b].problems ? ' prob' : ''}">${tagText}</span>`
        + (B[b].url ? `<a class="ext" href="${esc(B[b].url)}" target="_blank" rel="noopener">↗</a>` : '') + '</div>';
    }
  }

  if (D.goals.length) {
    h += '<h3>Routes to goals</h3>';
    for (const g of D.goals) {
      const r = routeFor([g]);
      h += `<div class="goal"><div class="gh" data-go="course:${g}"><span class="t">${esc(C[g].label)}</span>`
        + `<span class="n stat">${r.length ? plural(r.length, 'course') + ' to go' : 'done'}</span></div>${routeSteps(r)}</div>`;
    }
  }

  if (D.finished.length) {
    h += '<h3>Finished</h3>';
    for (const b of D.finished) {
      h += `<div class="item" data-go="book:${b}">${dot('finished')}<div class="main"><div class="t">${esc(B[b].label)}</div>`
        + (B[b].detail ? `<div class="d">${linkify(B[b].detail)}</div>` : '') + '</div></div>';
    }
  }

  if (D.skimmed.length) {
    h += '<h3>Skimmed</h3>';
    for (const b of D.skimmed) {
      h += `<div class="item" data-go="book:${b}">${dot('skimmed')}<div class="main"><div class="t">${esc(B[b].label)}</div>`
        + (B[b].detail ? `<div class="d">${linkify(B[b].detail)}</div>` : '') + '</div></div>';
    }
  }

  h += `<h3>Reading the map</h3><div class="legend">
    ${dot('finished')}<span>Finished — course done</span>
    ${dot('reading')}<span>Reading</span>
    ${dot('skimmed')}<span>Skimmed — no exercises; doesn't count toward prerequisites</span>
    <span class="tag" style="font-size:10px;letter-spacing:.05em;color:var(--faint)">SKIM</span><span>Companion: best skimmed next to a primary text; ignored when planning routes</span>
    <span class="tag prob" style="font-size:10px;letter-spacing:.05em">PROBLEMS</span><span>Problem book: the theory is built through problems</span>
    <span class="tag" style="font-size:10px;letter-spacing:.05em;color:var(--faint)">NOTES · VIDEO</span><span>Free lecture notes or a video lecture series (linked from its page)</span>
    ${dot('open')}<span>Open — all prerequisites met</span>
    ${dot('locked')}<span>Locked</span>
    <svg width="28" height="8"><path d="M0 4H28" stroke="var(--edge)" stroke-width="1.5"/></svg><span>Every book in the course needs it</span>

    <span></span><span>Faded rows are alternatives in a course already done. Implied edges are omitted. Rows follow subject; columns are prerequisite depth. Click anything; <b>/</b> to search (try “russian”, “problems”, “video”), <b>Esc</b> to reset, <b>f</b> to fit. Scroll to pan, pinch or ⌘-scroll to zoom.</span>
  </div>`;
  return h;
}

function renderCourse(id) {
  const c = C[id];
  let h = `<button class="back" data-go="home">← Overview</button>`;
  h += `<h2>${esc(c.label)}</h2><div class="sub">${esc(D.areas[AREA_IDX[c.area]].label)} · ${STATUS_WORD[c.status]}${c.goal ? ' · goal' : ''}${c.focus ? ' · focus' : ''}</div>`;
  if (c.mathlib) h += `<div class="sub" title="How much of this material Mathlib already has (rough)">Mathlib coverage: ${esc(MATHLIB[c.mathlib] || c.mathlib)}</div>`;
  h += '<h3>Books</h3>';
  for (const b of c.members) {
    const bk = B[b], missing = bk.prereqs.filter(p => !sat.has(p));
    const d = bk.skimmed ? 'skimmed' + (bk.detail ? ' — ' + bk.detail : '')
      : bk.companion ? 'companion for skimming' + (bk.status === 'locked' ? ' · needs ' + missing.map(p => C[p].label).join(', ') : ' · ready')
      : bk.status === 'locked' ? 'needs ' + missing.map(p => C[p].label).join(', ')
      : bk.covered ? 'alternative — course already done' : bk.status === 'open' ? 'can start now' : bk.status;
    h += `<div class="item${bk.covered && !bk.skimmed ? ' dimmed' : ''}" data-go="book:${b}">${dot(bk.skimmed ? 'skimmed' : bk.status)}<div class="main"><div class="t">${esc(bk.label)}</div><div class="d">${esc(d)}</div></div></div>`;
  }
  const pre = coursePre(id);
  if (pre.length) {
    h += '<h3>Prerequisites</h3>';
    h += pre.map(p => {
      const who = primaries(id).filter(b => B[b].prereqs.includes(p));

      return `<div class="item" data-go="course:${p}">${cDot(p)}<div class="main"><div class="t">${esc(C[p].label)}</div>${d ? `<div class="d">${esc(d)}</div>` : ''}</div></div>`;
    }).join('');
  }

    h += `<h3>Shortest route · ${plural(r.length, 'course')}</h3>` + routeList(r);
  }
  if (c.notes) h += `<h3>Notes</h3><div class="notes">${renderNotes(c.notes)}</div>`;

function renderBook(id) {
  const b = B[id], c = b.course;
  let h = `<button class="back" data-go="home">← Overview</button>`;
  h += `<h2>${esc(b.label)}</h2><div class="sub">${b.skimmed ? 'skimmed — companion reading; does not satisfy prerequisites' : b.companion ? (b.status === 'locked' ? 'companion for skimming · locked' : 'companion for skimming — ready') : { finished: 'finished', reading: 'reading', open: b.covered ? 'open · alternative to a finished book' : 'open — can start now', locked: 'locked' }[b.status]}</div>`;
  const facets = [b.medium === 'video' && 'video lectures', b.medium === 'notes' && 'lecture notes',
    b.problems && 'problem book', b.tradition && `${b.tradition} school`].filter(Boolean).map(esc);
  if (b.url) facets.push(`<a href="${esc(b.url)}" target="_blank" rel="noopener">${b.medium === 'video' ? 'Watch' : 'Open'} ↗</a>`);
  if (facets.length) h += `<div class="sub">${facets.join(' · ')}</div>`;

  }

  if (b.notes) h += `<h3>Notes</h3><div class="notes">${renderNotes(b.notes)}</div>`;

function render() {

  selection = kind ? { kind, id } : null;
  const h = selection ? `#${kind === 'book' ? 'b' : 'c'}/${id}` : ' ';
  history.replaceState(null, '', h === ' ' ? location.pathname : h);

}

// ---------- search & keys ----------
const search = document.getElementById('search');
let matches = [];
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  world.querySelectorAll('.match').forEach(el => el.classList.remove('match'));
  world.classList.toggle('has-search', !!q);
  if (!q) { matches = []; return; }
  matches = D.courses.filter(c => c.label.toLowerCase().includes(q) || c.id.includes(q)
    || c.members.some(b => B[b].label.toLowerCase().includes(q) || B[b].tradition.includes(q)
      || (B[b].problems && 'problems'.startsWith(q)) || (B[b].medium !== 'book' && B[b].medium.startsWith(q)))).map(c => c.id);
  matches.forEach(id => cardEl[id].classList.add('match'));
});
search.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && matches.length) {
    const q = search.value.trim().toLowerCase();
    const c = matches[0];
    const b = C[c].members.find(x => B[x].label.toLowerCase().includes(q) || B[x].tradition.includes(q));
    const titleHit = C[c].label.toLowerCase().includes(q);
    search.value = ''; search.dispatchEvent(new Event('input')); search.blur();
    titleHit || !b ? select('course', c, true) : select('book', b, true);
  } else if (ev.key === 'Escape') { search.value = ''; search.dispatchEvent(new Event('input')); search.blur(); }
});
document.addEventListener('keydown', ev => {
  if (ev.target === search) return;
  if (ev.key === '/') { ev.preventDefault(); search.focus(); }
  else if (ev.key === 'Escape') select(null);
  else if (ev.key === 'f') fitView(true);
});

// ---------- boot ----------
function homeView() {
  // Readable zoom anchored at the top-left (where the current work lives);
  // ⤢ / f gives the whole map.
  const r = stage.getBoundingClientRect();
  const k = clampK(Math.min(1, Math.max(0.72, (r.width - 20) / WORLD_W)));
  Object.assign(view, { k, x: 10 - 8 * k, y: 60 });
  applyView();
}
homeView();
const m = location.hash.match(/^#([bc])\/(.+)$/);
if (m && (m[1] === 'c' ? C[m[2]] : B[m[2]])) select(m[1] === 'c' ? 'course' : 'book', m[2], true);
else render();
</script>
