<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mathmap</title>
<style>
:root {
  --bg: #f6f4ef;
  --lane: #efece4;
  --surface: #ffffff;
  --ink: #1f1e1c;
  --muted: #6d6a63;
  --faint: #a8a49b;
  --line: #dcd7cc;
  --edge: #b3ad9f;
  --accent: #b4441f;
  --finished: #2e8555;
  --finished-bg: #e6f2ea;
  --reading: #c07f0a;
  --reading-bg: #fbf0d9;
  --open: #2d68c4;
  --open-bg: #e6eefa;
  --locked: #9d998f;
  --shadow: 0 1px 2px rgba(40,30,10,.06), 0 2px 8px rgba(40,30,10,.05);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --lane: #1c1e22; --surface: #23262b; --ink: #e9e6df; --muted: #a09c93;
    --faint: #6b6860; --line: #353840; --edge: #555a63; --accent: #f08a5d;
    --finished: #5cc389; --finished-bg: #1f3328; --reading: #e7ab3c; --reading-bg: #3a2f18;
    --open: #6ea1f0; --open-bg: #1d2a40; --locked: #7c7a73;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --lane: #1c1e22; --surface: #23262b; --ink: #e9e6df; --muted: #a09c93;
  --faint: #6b6860; --line: #353840; --edge: #555a63; --accent: #f08a5d;
  --finished: #5cc389; --finished-bg: #1f3328; --reading: #e7ab3c; --reading-bg: #3a2f18;
  --open: #6ea1f0; --open-bg: #1d2a40; --locked: #7c7a73;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; }
button { font: inherit; color: inherit; }

/* ---------- stage ---------- */
#stage { position: fixed; inset: 0 400px 0 0; overflow: hidden; cursor: grab; touch-action: none; }
#stage.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 1; }

.lane { position: absolute; left: 0; border-top: 1px solid var(--line); }
.lane.alt { background: var(--lane); }
.lane-label { position: absolute; left: 20px; top: 18px; width: 130px; font-family: var(--serif); font-size: 17px; line-height: 1.2; color: var(--muted); font-style: italic; }
.stage-label { position: absolute; top: 18px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }

.card { position: absolute; z-index: 2; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--locked); border-radius: 6px; box-shadow: var(--shadow); transition: opacity .15s, box-shadow .15s, border-color .15s; }
.card .head { height: 38px; padding: 0 10px 0 11px; display: flex; align-items: center; gap: 6px; cursor: pointer; border-bottom: 1px solid var(--line); }
.card .title { flex: 1; min-width: 0; font-family: var(--serif); font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .badge { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 5px; border-radius: 3px; color: var(--accent); border: 1px solid currentColor; white-space: nowrap; }
.card.s-satisfied { border-left-color: var(--finished); }
.card.s-satisfied .head { background: var(--finished-bg); }
.card.s-active { border-left-color: var(--reading); }
.card.s-active .head { background: var(--reading-bg); }
.card.s-open { border-left-color: var(--open); }
.card.s-locked .title { color: var(--muted); }

.row { height: 25px; padding: 0 10px 0 11px; display: flex; align-items: center; gap: 7px; cursor: pointer; white-space: nowrap; overflow: hidden; font-size: 12.5px; }
.row:first-of-type { margin-top: 4px; }
.row:hover, .card .head:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.row .who { font-weight: 600; flex: 0 0 auto; max-width: 62%; overflow: hidden; text-overflow: ellipsis; }
.row .what { flex: 1 1 0; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; border: 1.5px solid var(--locked); }
.st-finished .dot, .dot.st-finished { background: var(--finished); border-color: var(--finished); }
.st-reading .dot, .dot.st-reading { background: var(--reading); border-color: var(--reading); }
.st-open .dot, .dot.st-open { border-color: var(--open); background: var(--open-bg); }
.row.st-locked .who { color: var(--muted); font-weight: 500; }
.row.covered { opacity: .5; }
.row .ext, .item .ext { flex: none; color: var(--faint); text-decoration: none; padding: 0 2px; }
.row .ext:hover, .item .ext:hover { color: var(--open); }
.row .tag + .ext { margin-left: 4px; }
.row .what + .ext { margin-left: auto; }
.row.more { color: var(--faint); font-size: 11.5px; padding-left: 27px; }
.row.skimmed { opacity: 1; }
.row.companion .who { font-weight: 500; font-style: italic; }
.row .tag, .item .tag { flex: none; margin-left: auto; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
.item .tag { margin-left: 6px; }
.tag.prob { color: var(--accent); }
.row.skimmed .dot, .dot.st-skimmed { border-color: var(--finished); background: linear-gradient(90deg, var(--finished) 50%, transparent 50%); }
.row.covered .who { font-weight: 500; }

/* highlight states */
#world.has-sel .card { opacity: .28; }
#world.has-sel .card.anc, #world.has-sel .card.desc, #world.has-sel .card.sel { opacity: 1; }
.card.sel { box-shadow: 0 0 0 2px var(--ink), var(--shadow); }
.card.route { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.row.sel { background: color-mix(in srgb, var(--accent) 16%, transparent); }
#world.has-search .card:not(.match) { opacity: .2; }
.card.match { box-shadow: 0 0 0 2px var(--open), var(--shadow); }

path.e { fill: none; stroke: var(--edge); stroke-width: 1.3; opacity: .7; transition: opacity .15s; marker-end: url(#arr); }
path.e.partial { stroke-dasharray: 4 3; }
#world.has-sel path.e { opacity: .08; }
#world.has-sel path.e.up { opacity: 1; stroke: var(--accent); stroke-width: 2; }
#world.has-sel path.e.down { opacity: .9; stroke: var(--open); stroke-width: 1.8; }
path.e.hl { opacity: 1; stroke: var(--ink); stroke-width: 2; }

/* ---------- toolbar ---------- */
#tools { position: fixed; top: 14px; left: 14px; display: flex; gap: 6px; z-index: 5; }
#search { width: 240px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; box-shadow: var(--shadow); }
#search:focus { outline: 2px solid var(--open); outline-offset: -1px; }
.tbtn { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; box-shadow: var(--shadow); font-size: 16px; line-height: 1; }
.tbtn:hover { border-color: var(--muted); }

/* ---------- panel ---------- */
#panel { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--line); padding: 22px 24px 40px; z-index: 6; }
#panel h1 { font-family: var(--serif); font-size: 26px; font-weight: 600; margin: 0; }
#panel h2 { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 4px 0 2px; line-height: 1.25; }
#panel h3 { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 26px 0 8px; font-weight: 600; }
#panel .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
#panel .back { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-size: 13px; margin-bottom: 12px; }
#panel .back:hover { color: var(--ink); }
#panel a { color: var(--open); text-decoration: none; }
#panel a:hover { text-decoration: underline; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px 2px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.notes { font-size: 14px; line-height: 1.6; color: var(--ink); }
.notes p { margin: 0 0 10px; }
.notes code { font-size: 12.5px; background: var(--lane); padding: 1px 4px; border-radius: 3px; }

.item { display: flex; gap: 10px; align-items: baseline; padding: 7px 8px; margin: 0 -8px; border-radius: 5px; cursor: pointer; }
.item:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.item .dot { position: relative; top: 1px; }
.item .main { flex: 1; min-width: 0; }
.item .t { font-weight: 600; }
.item .d { color: var(--muted); font-size: 12.5px; margin-top: 2px; line-height: 1.4; }
.item .n { color: var(--muted); font-size: 12px; white-space: nowrap; }
.item.dimmed .t { color: var(--muted); font-weight: 500; }

.now { border: 1px solid var(--line); border-left: 4px solid var(--reading); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.now:hover { border-color: var(--muted); border-left-color: var(--reading); }
.now .t { font-family: var(--serif); font-size: 16px; font-weight: 600; }
.now .d { color: var(--muted); font-size: 12.5px; margin-top: 3px; line-height: 1.45; }

.goal { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
.goal .gh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; cursor: pointer; }
.goal .gh .t { font-family: var(--serif); font-size: 16px; font-weight: 600; }
.goal .gh .n { color: var(--muted); font-size: 12px; white-space: nowrap; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.step { font-size: 12px; padding: 2px 7px; border-radius: 4px; background: var(--lane); color: var(--muted); cursor: pointer; border: 1px solid transparent; }
.step.ready { color: var(--open); border-color: color-mix(in srgb, var(--open) 50%, transparent); background: var(--open-bg); }
.step.active { color: var(--reading); border-color: color-mix(in srgb, var(--reading) 50%, transparent); background: var(--reading-bg); }
.step:hover { border-color: var(--muted); }

.chip { display: inline-flex; align-items: center; gap: 6px; margin: 0 4px 5px 0; padding: 3px 9px 3px 7px; border: 1px solid var(--line); border-radius: 5px; cursor: pointer; font-size: 12.5px; background: var(--surface); }
.chip:hover { border-color: var(--muted); }
.chip.inline { margin: 0; padding: 0 5px; border: 0; background: var(--lane); font-size: inherit; }

.legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.legend svg { display: block; }
.stat { font-variant-numeric: tabular-nums; }

@media (max-width: 760px) {
  #stage { inset: 0 0 46vh 0; }
  #panel { top: auto; left: 0; width: auto; height: 46vh; border-left: 0; border-top: 1px solid var(--line); padding: 16px 16px 32px; }
  #search { width: calc(100vw - 16px - 16px - 4 * 40px); }
  #tools { left: 16px; top: 12px; }
}
</style>
</head>
<body>
<div id="stage"><div id="world"><svg id="edges"><defs>
  <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5z" fill="context-stroke"/></marker>
</defs></svg></div></div>
<div id="tools">
  <input id="search" type="search" placeholder="Search  ( / )" autocomplete="off" aria-label="Search courses and books">
  <button class="tbtn" id="zin" title="Zoom in" aria-label="Zoom in">+</button>
  <button class="tbtn" id="zout" title="Zoom out" aria-label="Zoom out">−</button>
  <button class="tbtn" id="fit" title="Fit (f)" aria-label="Fit to screen">⤢</button>
  <button class="tbtn" id="all" title="Show or hide companions in cards" aria-label="Toggle companions">☰</button>
</div>
<aside id="panel"></aside>

<script>
const D = {"areas": [{"id": "panorama", "label": "Panoramas & history"}, {"id": "foundations", "label": "Foundations & logic"}, {"id": "categories", "label": "Categories"}, {"id": "algebra", "label": "Algebra"}, {"id": "number-theory", "label": "Number theory"}, {"id": "algebraic-geometry", "label": "Algebraic geometry"}, {"id": "topology-geometry", "label": "Topology & geometry"}, {"id": "analysis", "label": "Analysis"}, {"id": "probability", "label": "Probability & statistics"}, {"id": "combinatorics", "label": "Combinatorics"}], "goals": ["algebraic-geometry", "class-field-theory", "modular-forms", "riemannian-geometry", "automorphic-forms"], "courses": [{"id": "algebra-basic", "label": "Algebra (Basic)", "area": "algebra", "layer": 0, "status": "open", "members": ["artin-algebra", "aluffi-chapter-zero", "pinter-book-of-abstract-algebra", "gross-abstract-algebra-videos", "carter-visual-group-theory", "vinberg-course-in-algebra", "shafarevich-basic-notions-algebra", "borcherds-group-theory-videos", "milne-group-theory-notes"], "focus": false, "mathlib": "strong", "goal": false, "notes": "Groups, rings, fields at the level of a standard first course in\nabstract algebra. Artin has a geometric flavor; Aluffi weaves\ncategory theory in from the start."}, {"id": "algebraic-geometry", "label": "Algebraic Geometry (Schemes)", "area": "algebraic-geometry", "layer": 2, "status": "locked", "members": ["vakil-rising-sea", "eisenbud-harris-geometry-of-schemes", "mumford-red-book", "liu-algebraic-geometry-arithmetic-curves", "borcherds-schemes-videos"], "focus": false, "mathlib": "partial", "goal": true, "notes": "Schemes, sheaves, morphisms, quasicoherent sheaves, cohomology. Vakil\nis the full course and the stated favorite; Eisenbud–Harris builds\nintuition for schemes through explicit examples and pairs well\nalongside it. Best approached after\n[[algebraic-geometry-classical]]."}, {"id": "algebraic-geometry-classical", "label": "Algebraic Geometry (Varieties)", "area": "algebraic-geometry", "layer": 1, "status": "locked", "members": ["cox-little-oshea-ideals-varieties-algorithms", "harris-algebraic-geometry-first-course", "reid-undergraduate-algebraic-geometry", "fulton-algebraic-curves", "gathmann-algebraic-geometry-notes", "shafarevich-basic-algebraic-geometry-1", "borcherds-algebraic-geometry-1-videos", "milne-algebraic-geometry-notes"], "focus": false, "mathlib": "thin", "goal": false, "notes": "Affine and projective varieties over an algebraically closed field,\nthe Nullstellensatz, morphisms, dimension, with lots of examples. Not\nrequired for [[algebraic-geometry]] (schemes), but it supplies the\npictures that make schemes intelligible. Cox–Little–O'Shea is the\ncomputational undergraduate entry; Harris is a tour of classical\nexamples."}, {"id": "algebraic-number-theory", "label": "Algebraic Number Theory", "area": "number-theory", "layer": 1, "status": "locked", "members": ["marcus-number-fields", "stewart-tall-algebraic-number-theory", "murty-esmonde-problems-algebraic-number-theory", "edwards-fermats-last-theorem", "kato-kurokawa-saito-number-theory-1", "sutherland-number-theory-notes", "neukirch-algebraic-number-theory", "borevich-shafarevich-number-theory", "manin-panchishkin-modern-number-theory", "milne-algebraic-number-theory-notes"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Rings of integers, ideal class groups, Dirichlet's unit theorem,\nlocal fields, ramification. The bridge from elementary number\ntheory to arithmetic geometry. Marcus is the undergrad-friendly\nentry; Neukirch is the grad-standard reference."}, {"id": "algebraic-topology", "label": "Algebraic Topology", "area": "topology-geometry", "layer": 2, "status": "locked", "members": ["hatcher-algebraic-topology", "fulton-algebraic-topology", "may-concise-algebraic-topology", "fomenko-fuchs-homotopical-topology", "prasolov-combinatorial-differential-topology", "albin-algebraic-topology-videos", "wildberger-algebraic-topology-videos"], "focus": false, "mathlib": "thin", "goal": false, "notes": "Fundamental group, covering spaces, homology, cohomology. Hatcher\nis the standard comprehensive reference; Fulton is gentler and more\nexample-driven."}, {"id": "analysis-advanced", "label": "Analysis (Advanced)", "area": "analysis", "layer": 1, "status": "open", "members": ["tao-analysis-2", "hubbard-vector-calculus-forms", "pugh-real-mathematical-analysis", "spivak-calculus-on-manifolds", "zorich-mathematical-analysis-2", "polya-szego-problems-theorems-analysis-1", "makarov-selected-problems-real-analysis"], "focus": false, "mathlib": "strong", "goal": false, "notes": "Metric spaces, multivariable calculus, Lebesgue integration. The\nfollow-on to `analysis-foundations`; prereq for differential\ngeometry, PDE, and complex analysis."}, {"id": "analysis-foundations", "label": "Analysis Foundations", "area": "analysis", "layer": 0, "status": "satisfied", "members": ["tao-analysis-1", "abbott-understanding-analysis", "rudin-principles-mathematical-analysis", "bressoud-radical-approach-real-analysis", "gelbaum-olmsted-counterexamples-analysis", "zorich-mathematical-analysis-1", "demidovich-problems-analysis", "hairer-wanner-analysis-by-its-history", "rodriguez-mit-real-analysis-videos"], "focus": false, "mathlib": "strong", "goal": false, "notes": "Real analysis at the level needed before topology and abstract\nalgebra. Tao is longer and more comprehensive; Abbott is the\nnarrative alternative designed for self-study; Rudin is the terse\nclassic; Bressoud is the historical, motivation-first companion."}, {"id": "analytic-number-theory", "label": "Analytic Number Theory", "area": "number-theory", "layer": 1, "status": "locked", "members": ["stopple-primer-analytic-number-theory", "jameson-prime-number-theorem", "murty-problems-analytic-number-theory"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Arithmetic functions, Dirichlet series, zeta and L-functions,\nDirichlet's theorem, the prime number theorem. The analytic half of\nthe arithmetic arc. Stopple is the gentle historical entry; Jameson\naims at the PNT; Murty is the problem-driven route."}, {"id": "automorphic-forms", "label": "Automorphic Representations", "area": "number-theory", "layer": 4, "status": "locked", "members": ["getz-hahn-automorphic-representations", "buzzard-msri-langlands-videos"], "focus": false, "mathlib": "thin", "goal": true, "notes": "Adeles, representations of reductive groups over local and global\nfields, automorphic representations, functoriality. Where the\nlong-term goal — reading Langlands-area papers — actually lives."}, {"id": "category-theory", "label": "Category Theory", "area": "categories", "layer": 1, "status": "locked", "members": ["leinster-basic-category-theory", "riehl-category-theory-in-context", "mac-lane-categories-working-mathematician"], "focus": false, "mathlib": "strong", "goal": false, "notes": "Categories, functors, natural transformations, limits, adjoints,\nYoneda. The native language of modern algebraic geometry and\nhomological algebra. Leinster is the short entry; Riehl is the\ncomprehensive follow-up."}, {"id": "category-theory-elementary", "label": "Category Theory (Elementary)", "area": "categories", "layer": 0, "status": "active", "members": ["lawvere-schanuel-conceptual-mathematics", "fong-spivak-seven-sketches", "borcherds-categories-videos"], "focus": true, "mathlib": "strong", "goal": false, "notes": "Categorical thinking without algebraic prerequisites — maps,\ncomposition, universal properties, products. Deliberately separate\nfrom [[category-theory]]: finishing it does not stand in for\nLeinster/Riehl, so it unlocks nothing downstream on its own."}, {"id": "characteristic-classes", "label": "Characteristic Classes", "area": "topology-geometry", "layer": 3, "status": "locked", "members": ["bott-tu-differential-forms", "tu-differential-geometry", "madsen-tornehave-calculus-to-cohomology", "milnor-stasheff-characteristic-classes", "morita-geometry-differential-forms", "baez-muniain-gauge-fields-knots-gravity", "hatcher-vector-bundles-k-theory"], "focus": false, "mathlib": "thin", "goal": false, "notes": "Stiefel–Whitney, Chern, Pontryagin classes — topological invariants\nof vector bundles, together with the forms, connections, and\ncurvature used to build them. Three routes: Bott–Tu through\ndifferential forms and Čech cohomology; Tu through connections and\nChern–Weil theory; Milnor–Stasheff topologically, after\n[[algebraic-topology]]."}, {"id": "class-field-theory", "label": "Class Field Theory", "area": "number-theory", "layer": 2, "status": "locked", "members": ["cox-primes-of-form", "childress-class-field-theory", "milne-class-field-theory", "cassels-frohlich-algebraic-number-theory", "kedlaya-class-field-theory-notes"], "focus": false, "mathlib": "thin", "goal": true, "notes": "Abelian extensions of number fields — ideal class groups, Artin\nreciprocity, complex multiplication. Cox develops it concretely\nthrough the question of which primes are represented by x²+ny²;\nChildress gives the general ideal-theoretic and idelic statements."}, {"id": "combinatorics-basic", "label": "Combinatorics (Basic)", "area": "combinatorics", "layer": 0, "status": "open", "members": ["van-lint-wilson-combinatorics", "west-combinatorial-mathematics", "lovasz-combinatorial-problems-exercises", "matousek-nesetril-invitation-discrete-mathematics", "aigner-ziegler-proofs-from-the-book"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Broad combinatorics — counting, designs, codes, Ramsey, extremal,\nprobabilistic method. van Lint & Wilson is the classic survey;\nWest is the modern narrative alternative. For deeper enumerative\nwork see `enumerative-combinatorics`; for graphs specifically see\n`graph-theory`."}, {"id": "commutative-algebra-basic", "label": "Commutative Algebra (Basic)", "area": "algebra", "layer": 1, "status": "locked", "members": ["reid-undergraduate-commutative-algebra", "eisenbud-commutative-algebra", "gathmann-commutative-algebra-notes", "atiyah-macdonald", "altman-kleiman-term-commutative-algebra", "borcherds-commutative-algebra-videos"], "focus": false, "mathlib": "strong", "goal": false, "notes": "Rings, ideals, modules, localization, Noetherian rings, primary\ndecomposition. Eisenbud is more expansive; Atiyah–Macdonald is\ncompact but terse; Reid is short and\nnarrative."}, {"id": "complex-analysis", "label": "Complex Analysis", "area": "analysis", "layer": 2, "status": "locked", "members": ["stein-shakarchi-complex-analysis", "ahlfors-complex-analysis", "needham-visual-complex-analysis", "volkovyskii-problems-complex-analysis", "bonfert-taylor-complex-analysis-videos", "borcherds-complex-analysis-videos"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Holomorphic functions, Cauchy theory, conformal maps, analytic\ncontinuation, special functions. Stein–Shakarchi is the friendlier\nprimary path; Ahlfors is the classic alternative."}, {"id": "complex-geometry", "label": "Complex Manifolds and Hodge Theory", "area": "algebraic-geometry", "layer": 3, "status": "locked", "members": ["huybrechts-complex-geometry", "arapura-algebraic-geometry-complex-numbers"], "focus": false, "mathlib": "thin", "goal": false, "notes": "Complex and Kähler manifolds, Dolbeault cohomology, the Hodge\ndecomposition, line bundles and divisors, Kodaira vanishing, sheaf\ncohomology from the analytic side. The bridge where the differential\ntrack pays off for algebraic geometry."}, {"id": "computability", "label": "Computability Theory", "area": "foundations", "layer": 0, "status": "open", "members": ["shen-vereshchagin-computable-functions"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Computable and enumerable sets, undecidability, reducibility, the\narithmetical hierarchy. The part of logic Gödel's theorems rest on."}, {"id": "differential-geometry-classical", "label": "Differential Geometry (Classical)", "area": "topology-geometry", "layer": 1, "status": "locked", "members": ["do-carmo-curves-and-surfaces", "shifrin-differential-geometry-notes", "needham-visual-differential-geometry", "dubrovin-fomenko-novikov-modern-geometry-1", "katok-climenhaga-lectures-on-surfaces", "hilbert-cohn-vossen-geometry-imagination", "crane-discrete-differential-geometry-videos"], "focus": false, "mathlib": "thin", "goal": false, "notes": "Curves and surfaces in R³ — Gauss map, first and second\nfundamental forms, Gauss–Bonnet. Concrete entry before the\nabstract manifold machinery of `smooth-manifolds`."}, {"id": "differential-topology", "label": "Differential Topology", "area": "topology-geometry", "layer": 2, "status": "locked", "members": ["guillemin-pollack-differential-topology"], "focus": false, "mathlib": "thin", "goal": false, "notes": "Transversality, intersection theory, degree, Poincaré–Hopf.\nGlobal smooth-manifold questions without a metric. Companion to\nbut distinct from `smooth-manifolds`."}, {"id": "elliptic-curves", "label": "Elliptic Curves", "area": "number-theory", "layer": 1, "status": "locked", "members": ["silverman-tate-rational-points", "silverman-arithmetic-elliptic-curves", "sutherland-elliptic-curves-notes"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Elliptic curves over Q, local fields, and finite fields — rational\npoints, heights, reduction, L-series. Silverman–Tate is the\nundergraduate entry; Silverman is the canonical graduate text."}, {"id": "enumerative-combinatorics", "label": "Enumerative Combinatorics", "area": "combinatorics", "layer": 1, "status": "open", "members": ["wilf-generatingfunctionology", "stanley-enumerative-combinatorics-1"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Counting techniques in depth: sieve methods, posets and lattices,\nrational and algebraic generating functions. More specialized than\nbroad combinatorics; Stanley's EC1 is the graduate-standard\nreference."}, {"id": "formalization-lean", "label": "Formalizing Mathematics in Lean", "area": "foundations", "layer": 0, "status": "satisfied", "members": ["avigad-massot-mathematics-in-lean", "macbeth-mechanics-of-proof", "velleman-how-to-prove-it-lean", "avigad-de-moura-theorem-proving-in-lean-4", "buzzard-formalising-mathematics"], "focus": false, "mathlib": "native", "goal": false, "notes": "The tool every other course's exercises go through. Mathematics in\nLean is the canonical Mathlib on-ramp; Macbeth builds fluency from the\nground up; the rest are references and a second angle."}, {"id": "fourier-analysis", "label": "Fourier Analysis", "area": "analysis", "layer": 1, "status": "open", "members": ["stein-shakarchi-fourier-analysis", "korner-fourier-analysis"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Fourier series and transforms, summability, applications to PDE and\nnumber theory. A bridge from analysis to arithmetic: Dirichlet's\ntheorem, theta functions, and eventually modular forms."}, {"id": "functional-analysis", "label": "Functional Analysis", "area": "analysis", "layer": 2, "status": "locked", "members": ["brezis-functional-analysis", "reed-simon-functional-analysis", "maccluer-elementary-functional-analysis", "kolmogorov-fomin-introductory-real-analysis", "rodriguez-mit-functional-analysis-videos"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Banach and Hilbert spaces, bounded operators, spectral theorem,\nweak topologies, distributions, Sobolev spaces. Brezis is\nnarrative and exercised with a PDE bent; Reed–Simon is thorough\nwith a mathematical-physics flavor."}, {"id": "galois-theory", "label": "Galois Theory", "area": "algebra", "layer": 1, "status": "locked", "members": ["cox-galois-theory", "stewart-galois-theory", "brzezinski-galois-theory-through-exercises", "morandi-field-galois-theory", "edwards-galois-theory", "alekseev-abels-theorem-problems", "skopenkov-mathematics-via-problems-algebra", "borcherds-galois-theory-videos", "milne-fields-galois-theory-notes", "conrad-expository-papers"], "focus": false, "mathlib": "strong", "goal": false, "notes": "Field extensions, Galois correspondence, solvability by radicals,\nfinite and infinite Galois theory. Central step on the Langlands\narc. Cox is the narrative entry; Morandi is the comprehensive\ngraduate alternative."}, {"id": "graph-theory", "label": "Graph Theory", "area": "combinatorics", "layer": 1, "status": "locked", "members": ["west-introduction-to-graph-theory"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Graphs, trees, matchings, connectivity, coloring, planarity,\nextremal and algebraic graph theory. West is the standard entry;\nalternatives (Diestel, Bollobás) could join later."}, {"id": "homological-algebra", "label": "Homological Algebra", "area": "categories", "layer": 1, "status": "locked", "members": ["rotman-homological-algebra", "weibel-homological-algebra", "borcherds-homological-algebra-videos"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Chain complexes, derived functors, Ext, Tor, spectral sequences,\nderived categories. Prereq for advanced algebraic geometry and\nalgebraic topology. Rotman is gentler; Weibel is the standard\nreference."}, {"id": "inequalities", "label": "Inequalities", "area": "analysis", "layer": 1, "status": "open", "members": ["steele-cauchy-schwarz-master-class"], "focus": false, "mathlib": "strong", "goal": false, "notes": "The working toolkit of analysis — Cauchy–Schwarz, AM-GM, convexity,\nHölder — learned through problems. Small, self-contained, and pays off\neverywhere in analysis and combinatorics."}, {"id": "lie-theory", "label": "Lie Groups and Lie Algebras", "area": "algebra", "layer": 1, "status": "locked", "members": ["stillwell-naive-lie-theory", "hall-lie-groups", "erdmann-wildon-lie-algebras", "borcherds-lie-groups-videos"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Matrix Lie groups, Lie algebras, the exponential map, semisimple Lie\nalgebras, root systems, highest-weight representations. Needed for\nthe automorphic side of Langlands and for principal bundles on the\ndifferential side. Kept separate from [[representation-theory]]\nbecause finite-group character theory does not prepare you for it."}, {"id": "linear-algebra-basic", "label": "Linear Algebra (Basic)", "area": "algebra", "layer": 0, "status": "active", "members": ["axler-linear-algebra", "halmos-finite-dimensional-vector-spaces", "gelfand-lectures-linear-algebra", "kostrikin-manin-linear-algebra-geometry", "faddeev-sominsky-problems-higher-algebra", "axler-ladr-videos", "3b1b-essence-linear-algebra"], "focus": true, "mathlib": "strong", "goal": false, "notes": "Vector spaces, inner product spaces, operators. Axler's treatment\navoids determinants early."}, {"id": "logic-basic", "label": "Logic (Basic)", "area": "foundations", "layer": 0, "status": "open", "members": ["enderton-mathematical-logic", "van-dalen-logic-and-structure", "avigad-mathematical-logic-and-computation", "hofstadter-godel-escher-bach", "manin-course-mathematical-logic", "kunen-foundations-of-mathematics", "stillwell-reverse-mathematics"], "focus": false, "mathlib": "partial", "goal": false, "notes": "First-order logic through completeness, compactness, models.\nEnderton is the American classic; van Dalen is the European\nalternative with an intuitionistic-logic chapter; Avigad adds a\ncomputational/proof-theoretic angle and is the natural pick for\nformalizing in Lean."}, {"id": "low-dimensional-topology", "label": "Surfaces, Knots and 3-Manifolds", "area": "topology-geometry", "layer": 2, "status": "locked", "members": ["stillwell-geometry-of-surfaces", "thurston-three-dimensional-geometry-topology", "prasolov-sossinsky-knots-links-braids"], "focus": false, "mathlib": "thin", "goal": false, "notes": "Hyperbolic geometry, geometric structures on surfaces and\n3-manifolds, knot invariants. Optional enrichment that makes the\nfundamental group, covering spaces, and group actions vivid."}, {"id": "mathematical-panorama", "label": "Panoramas and History", "area": "panorama", "layer": 0, "status": "open", "members": ["stillwell-mathematics-and-its-history", "fuchs-tabachnikov-mathematical-omnibus", "gowers-princeton-companion", "polya-mathematics-plausible-reasoning", "chen-infinitely-large-napkin", "chua-cambridge-notes"], "focus": false, "mathlib": "", "goal": false, "notes": "Books that span the subject: history told with real proofs, tours\nof classic results, surveys of the landscape, and how mathematicians\nthink. Read alongside any course."}, {"id": "measure-theory", "label": "Measure Theory", "area": "analysis", "layer": 1, "status": "open", "members": ["axler-measure-integration-real-analysis", "tao-measure-theory", "stein-shakarchi-real-analysis", "folland-real-analysis"], "focus": false, "mathlib": "strong", "goal": false, "notes": "Lebesgue measure and integration, Lp spaces, differentiation,\nproduct measures, Fourier analysis. Deeper than what Tao II covers.\nAxler is the most accessible, needing only Tao I;\nStein–Shakarchi is narrative; Folland is the compact grad standard."}, {"id": "model-theory", "label": "Model Theory", "area": "foundations", "layer": 1, "status": "locked", "members": ["marker-model-theory"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Structures, definability, types, quantifier elimination, saturated\nmodels, ω-stability. Marker grounds the theory in explicit\nexamples from algebra."}, {"id": "modular-forms", "label": "Modular Forms", "area": "number-theory", "layer": 3, "status": "locked", "members": ["koblitz-elliptic-curves-modular-forms", "diamond-shurman-modular-forms", "serre-course-in-arithmetic", "ash-gross-fearless-symmetry", "borcherds-modular-forms-videos", "milne-modular-functions-forms-notes"], "focus": false, "mathlib": "partial", "goal": true, "notes": "Modular forms for SL(2,Z) and congruence subgroups, Hecke operators,\nL-functions. Koblitz introduces them concretely alongside elliptic\ncurves. Diamond–Shurman goes on to modular\ncurves and Galois representations. Direct leg of the Langlands arc."}, {"id": "number-theory-basic", "label": "Number Theory (Basic)", "area": "number-theory", "layer": 0, "status": "open", "members": ["niven-zuckerman-montgomery", "stillwell-elements-number-theory", "ireland-rosen", "hatcher-topology-of-numbers", "hardy-wright-theory-of-numbers", "vinogradov-elements-number-theory", "khinchin-continued-fractions", "laczkovich-conjecture-and-proof", "borcherds-number-theory-115-videos", "borcherds-theory-of-numbers-videos"], "focus": false, "mathlib": "strong", "goal": false, "notes": "Either book satisfies the course for downstream purposes, though\nIreland & Rosen goes further and requires abstract algebra. Niven\net al. is the lighter entry point."}, {"id": "ordinary-differential-equations", "label": "Ordinary Differential Equations", "area": "analysis", "layer": 2, "status": "locked", "members": ["hirsch-smale-devaney-differential-equations", "teschl-ode-dynamical-systems", "arnold-ordinary-differential-equations", "strogatz-nonlinear-dynamics-chaos"], "focus": false, "mathlib": "thin", "goal": false, "notes": "Linear and nonlinear ODE, stability, phase-space geometry,\ndynamical systems, bifurcations. Hirsch–Smale–Devaney is geometric\nand narrative; Teschl is the modern proof-centric alternative."}, {"id": "p-adic-numbers", "label": "p-adic Numbers and Local Fields", "area": "number-theory", "layer": 1, "status": "locked", "members": ["gouvea-p-adic-numbers", "katok-p-adic-analysis"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Absolute values and completions, ℚ_p, Hensel's lemma, extensions of\nlocal fields. The local half of the local–global principle, needed\nbefore local class field theory and much of modern arithmetic. Gouvêa\nis the motivated entry; Katok compares with real analysis."}, {"id": "partial-differential-equations", "label": "Partial Differential Equations", "area": "analysis", "layer": 2, "status": "locked", "members": ["evans-pde", "arnold-lectures-pde"], "focus": false, "mathlib": "thin", "goal": false, "notes": "Transport, Laplace, heat, wave equations; Sobolev spaces, weak\nsolutions, regularity. Evans is the standard graduate entry."}, {"id": "point-set-topology", "label": "Point-Set Topology", "area": "topology-geometry", "layer": 1, "status": "open", "members": ["munkres-topology", "lee-topological-manifolds", "viro-elementary-topology-problem-textbook", "steen-seebach-counterexamples-topology", "tokieda-topology-geometry-videos"], "focus": true, "mathlib": "strong", "goal": false, "notes": "Topological spaces, continuity, compactness, connectedness. Munkres\nPart I is the classic; Lee develops the same material around\nmanifolds and continues into the fundamental group and homology."}, {"id": "probabilistic-combinatorics", "label": "Probabilistic Combinatorics", "area": "combinatorics", "layer": 3, "status": "locked", "members": ["alon-spencer-probabilistic-method"], "focus": false, "mathlib": "thin", "goal": false, "notes": "Erdős's probabilistic method: proving existence by showing a random\nobject works. Moments, local lemma, concentration, random graphs."}, {"id": "probability-basic", "label": "Probability (Basic)", "area": "probability", "layer": 2, "status": "locked", "members": ["grimmett-stirzaker-probability", "williams-probability-martingales", "durrett-probability", "feller-probability-vol-1", "shiryaev-probability"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Probability theory from discrete through measure-theoretic:\nindependence, laws of large numbers, CLT, martingales, Brownian\nmotion. Grimmett–Stirzaker is the broader undergrad–grad path;\nDurrett is measure-theoretic throughout."}, {"id": "projective-geometry", "label": "Projective and Classical Geometry", "area": "topology-geometry", "layer": 1, "status": "locked", "members": ["richter-gebert-projective-geometry"], "focus": false, "mathlib": "thin", "goal": false, "notes": "Klein's view of geometry: projective, Euclidean, hyperbolic, and\nelliptic geometries as subgeometries of projective space. Projective\nspace is also the basic ambient space of algebraic geometry."}, {"id": "representation-theory", "label": "Representation Theory", "area": "algebra", "layer": 1, "status": "locked", "members": ["james-liebeck-representations", "fulton-harris-representation-theory", "etingof-introduction-representation-theory", "serre-linear-representations", "borcherds-representation-theory-videos"], "focus": false, "mathlib": "partial", "goal": false, "notes": "Representations and characters of finite groups. James–Liebeck is\nthe gentle undergraduate entry; Fulton–Harris covers the same\nmaterial and goes on to Lie algebras. For Lie groups proper see\n[[lie-theory]]."}, {"id": "riemann-surfaces", "label": "Riemann Surfaces", "area": "algebraic-geometry", "layer": 3, "status": "locked", "members": ["miranda-algebraic-curves-riemann-surfaces", "kirwan-complex-algebraic-curves", "donaldson-riemann-surfaces"], "focus": false, "mathlib": "thin", "goal": false, "notes": "Compact Riemann surfaces as 1-dimensional complex manifolds /\nalgebraic curves over ℂ. Divisors, line bundles, Riemann–Roch,\nAbel's theorem. Concrete bridge from complex analysis to algebraic\ngeometry."}, {"id": "riemannian-geometry", "label": "Riemannian Geometry", "area": "topology-geometry", "layer": 3, "status": "locked", "members": ["lee-riemannian-manifolds", "do-carmo-riemannian-geometry", "petersen-riemannian-geometry", "berger-panoramic-riemannian", "schuller-gravity-light-videos", "tong-general-relativity-notes", "nicolaescu-geometry-of-manifolds-notes"], "focus": false, "mathlib": "thin", "goal": true, "notes": "Riemannian metrics, connections, geodesics, curvature. do Carmo is\ncompact; Lee is more expansive and pairs with his smooth manifolds\nvolume; Petersen is stronger on comparison geometry and examples."}, {"id": "set-theory-basic", "label": "Set Theory (Basic)", "area": "foundations", "layer": 0, "status": "open", "members": ["halmos-naive-set-theory", "enderton-elements-set-theory", "shen-vereshchagin-basic-set-theory", "borcherds-zermelo-fraenkel-videos"], "focus": false, "mathlib": "strong", "goal": false, "notes": "Axiomatic set theory through ordinals, cardinals, axiom of choice.\nEither member suffices."}, {"id": "smooth-manifolds", "label": "Smooth Manifolds", "area": "topology-geometry", "layer": 2, "status": "locked", "members": ["tu-introduction-to-manifolds", "lee-smooth-manifolds", "frankel-geometry-of-physics", "arnold-mathematical-methods-classical-mechanics", "schuller-geometric-anatomy-videos", "hitchin-differentiable-manifolds-notes"], "focus": false, "mathlib": "thin", "goal": false, "notes": "Smooth manifolds, tangent bundles, differential forms, de Rham\ncohomology. Tu is the gentler path; Lee is more thorough. Either\nsatisfies the course."}, {"id": "statistics-basic", "label": "Statistics (Basic)", "area": "probability", "layer": 3, "status": "locked", "members": ["casella-berger-statistical-inference"], "focus": false, "mathlib": "thin", "goal": false, "notes": "Mathematical statistics built on probability: estimation,\nsufficiency, likelihood, hypothesis testing, confidence intervals,\nasymptotics. The inference layer on top of probability theory."}, {"id": "type-theory", "label": "Type Theory", "area": "foundations", "layer": 0, "status": "open", "members": ["nederpelt-geuvers-type-theory", "hott-book"], "focus": false, "mathlib": "native", "goal": false, "notes": "Lambda calculi and dependent type theory: the foundations Lean is\nbuilt on. Useful background for doing every exercise in Lean."}], "books": {"3b1b-essence-linear-algebra": {"label": "3Blue1Brown, Essence of Linear Algebra (video series)", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab", "course": "linear-algebra-basic", "prereqs": [], "detail": "", "notes": "Lecturer: Grant Sanderson. 16 animated chapters — vectors, span, maps\nas matrices, determinants, change of basis, eigenvectors, abstract\nvector spaces. Pure geometric intuition, no proofs; supplies the\npicture Axler deliberately leaves out."}, "abbott-understanding-analysis": {"label": "Abbott, Understanding Analysis", "status": "open", "covered": true, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "analysis-foundations", "prereqs": [], "detail": "", "notes": "Author: Abbott. Undergraduate real analysis, single-variable,\nexceptionally narrative. Each chapter motivated by a question; proofs\ndeveloped conversationally. Alternative entry point to Tao I."}, "ahlfors-complex-analysis": {"label": "Ahlfors, Complex Analysis", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "complex-analysis", "prereqs": ["analysis-advanced"], "detail": "", "notes": "Author: Ahlfors. The classic graduate text; many later books assume\nan Ahlfors-level background. Dense and terser than Stein–Shakarchi —\nskim alongside or after it rather than learning from it first."}, "aigner-ziegler-proofs-from-the-book": {"label": "Aigner & Ziegler, Proofs from THE BOOK", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "combinatorics-basic", "prereqs": [], "detail": "", "notes": "Authors: Aigner, Ziegler. Short, beautiful proofs across number\ntheory, geometry, analysis, combinatorics, and graph theory. Each\nchapter is self-contained; ideal for skimming."}, "albin-algebraic-topology-videos": {"label": "Albin, Algebraic Topology I (video lectures)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PLjuyMEhIbRmBixjg0ZeRvWBQx_KMGC5Tv", "course": "algebraic-topology", "prereqs": ["point-set-topology", "algebra-basic"], "detail": "", "notes": "Lecturer: Pierre Albin (UIUC), a first-year graduate course recorded\nlive. 27 lectures following Hatcher chapters 1–2: homotopy, π₁ and van\nKampen, covering spaces and their classification, simplicial and\nsingular homology, exact sequences, excision. Clear and well paced."}, "alekseev-abels-theorem-problems": {"label": "Alekseev, Abel's Theorem in Problems and Solutions", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": true, "medium": "book", "url": "", "course": "galois-theory", "prereqs": [], "detail": "", "notes": "Author: V. B. Alekseev, from V. I. Arnold's lectures to Moscow\nschoolchildren. Proves the quintic is not solvable by radicals\ntopologically — via Riemann surfaces and monodromy — entirely\nthrough a chain of problems, with hints and solutions. Group theory\nand complex functions built from scratch. The Arnold style in its\npurest form: geometry first, everything discovered by the reader."}, "alon-spencer-probabilistic-method": {"label": "Alon & Spencer, The Probabilistic Method", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "probabilistic-combinatorics", "prereqs": ["combinatorics-basic", "probability-basic"], "detail": "", "notes": "Authors: Alon, Spencer. First and second moments, alterations, the\nLovász Local Lemma, correlation inequalities, martingales and\nconcentration, random graphs, discrepancy; \"Probabilistic Lens\"\nvignettes between chapters. Erdős in spirit; exercises. Dense — not a\nfirst combinatorics book."}, "altman-kleiman-term-commutative-algebra": {"label": "Altman & Kleiman, A Term of Commutative Algebra", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "https://www.centerofmath.org/textbooks/commalgebra/", "course": "commutative-algebra-basic", "prereqs": ["algebra-basic"], "detail": "", "notes": "Authors: Altman, Kleiman. The Atiyah–Macdonald syllabus in 26 short\nchapters with exercises embedded in the text and complete solutions —\nincluding solutions to all of Atiyah–Macdonald's exercises. Terse, so\nnot a first read, but an ideal answer key when formalizing Reid or\nA–M in Lean. Free online."}, "aluffi-chapter-zero": {"label": "Aluffi, Algebra: Chapter 0", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebra-basic", "prereqs": ["linear-algebra-basic"], "detail": "", "notes": "Author: Aluffi. Abstract algebra with category theory woven in\nfrom the start. Narrative, exercise-heavy, takes the categorical\npoint of view seriously. Alternative to Artin."}, "arapura-algebraic-geometry-complex-numbers": {"label": "Arapura, Algebraic Geometry over the Complex Numbers", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "complex-geometry", "prereqs": ["smooth-manifolds", "algebraic-topology", "commutative-algebra-basic"], "detail": "", "notes": "Author: Donu Arapura. Sheaves and sheaf cohomology, de Rham and\nDolbeault, Hodge theory on Kähler manifolds, then GAGA-style algebraic\nmethods. Treats sheaf cohomology from both the differential and the\nalgebraic side — exactly the bridge the differential track is for.\nRead alongside Huybrechts or just before Vakil's cohomology chapters."}, "arnold-lectures-pde": {"label": "Arnold, Lectures on Partial Differential Equations", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "partial-differential-equations", "prereqs": ["analysis-advanced"], "detail": "", "notes": "Author: V. I. Arnold. Short lectures on the heat, wave, and Laplace\nequations, characteristics, and Huygens's principle, emphasizing\ngeometry and physical meaning over estimates. The opposite end of\nthe spectrum from Evans."}, "arnold-mathematical-methods-classical-mechanics": {"label": "Arnold, Mathematical Methods of Classical Mechanics", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "smooth-manifolds", "prereqs": ["analysis-advanced", "linear-algebra-basic"], "detail": "", "notes": "Author: V. I. Arnold. Newtonian, Lagrangian, and Hamiltonian\nmechanics developed on manifolds, with differential forms, symplectic\ngeometry, and Lie groups introduced as the physics needs them.\nGeometric and opinionated; the book where many first see why forms\nand symplectic structures exist."}, "arnold-ordinary-differential-equations": {"label": "Arnold, Ordinary Differential Equations", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "ordinary-differential-equations", "prereqs": ["analysis-advanced", "linear-algebra-basic"], "detail": "", "notes": "Author: V. I. Arnold. ODEs as vector fields and flows on\nmanifolds, with pictures instead of calculations. Idiosyncratic and\ngeometric; a strong contrast to proof-centric texts."}, "artin-algebra": {"label": "Artin, Algebra", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebra-basic", "prereqs": ["linear-algebra-basic"], "detail": "", "notes": "Author: Artin. Groups, rings, fields, with a geometric flavor and\nlots of examples. Good first abstract algebra."}, "ash-gross-fearless-symmetry": {"label": "Ash & Gross, Fearless Symmetry", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "modular-forms", "prereqs": [], "detail": "", "notes": "Authors: Ash, Gross. *Exposing the Hidden Patterns of Numbers.*\nPopular-level account of Galois representations, reciprocity laws,\nand the ideas behind Wiles's proof. No prerequisites. A map of where\nthe whole long-term arc is heading; readable now."}, "atiyah-macdonald": {"label": "Atiyah–Macdonald, Introduction to Commutative Algebra", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "commutative-algebra-basic", "prereqs": ["algebra-basic"], "detail": "", "notes": "Authors: Atiyah, Macdonald. Short and dense; the famous exercises\ncarry much of the content. The canonical clean treatment, and a poor\nfirst book for this reader. Skim it after Reid or Eisenbud, when the\nideas are already familiar and the compactness becomes a pleasure."}, "avigad-de-moura-theorem-proving-in-lean-4": {"label": "Avigad, de Moura, Kong, Ullrich — Theorem Proving in Lean 4", "status": "finished", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "https://lean-lang.org/theorem_proving_in_lean4/", "course": "formalization-lean", "prereqs": [], "detail": "", "notes": "Authors: Avigad, de Moura, Kong, Ullrich. The language guide to\ndependent type theory as Lean implements it: universes, inductive\ntypes, tactics, type classes, axioms. Expository, few exercises. Dip\nin when an elaboration error makes no sense; connects Nederpelt–Geuvers\nto what Lean actually does. Free online."}, "avigad-massot-mathematics-in-lean": {"label": "Avigad & Massot, Mathematics in Lean", "status": "finished", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "https://leanprover-community.github.io/mathematics_in_lean/", "course": "formalization-lean", "prereqs": [], "detail": "", "notes": "Authors: Avigad, Massot. Lean 4 and Mathlib taught through the\nmathematics: logic, sets and functions, elementary number theory,\nstructures and hierarchies, groups and rings, linear algebra,\ntopology, calculus. A tutorial with exercise files filled in inside\nthe editor. The canonical on-ramp to the Mathlib idioms every other\nbook's exercises need. Free online, kept current."}, "avigad-mathematical-logic-and-computation": {"label": "Avigad, Mathematical Logic and Computation", "status": "open", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "logic-basic", "prereqs": [], "detail": "", "notes": "Author: Avigad. Propositional and first-order logic via natural\ndeduction and sequent calculus, completeness, computability, Gödel's\nincompleteness, intuitionistic logic and type theory. Written with a\nformalization sensibility (Avigad co-founded mathlib) — a natural\ncompanion for doing the exercises in Lean."}, "axler-ladr-videos": {"label": "Axler, Linear Algebra Done Right (video lectures)", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://linear.axler.net/LADRvideos4e.html", "course": "linear-algebra-basic", "prereqs": [], "detail": "", "notes": "Lecturer: Sheldon Axler. About 50 short slide-based videos, one per\nsection, from vector spaces to Jordan form and the spectral theorem.\nA crisp summary of each section; watch right before reading it."}, "axler-linear-algebra": {"label": "Axler, Linear Algebra Done Right", "status": "reading", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "https://linear.axler.net/", "course": "linear-algebra-basic", "prereqs": [], "detail": "started 06'26 — Lean: https://github.com/rkirov/linear-algebra-done-right-lean/tree/main/LinearAlgebraDoneRightLean", "notes": "Author: Axler. Vector spaces and operators without leaning on\ndeterminants early. Clean, opinionated, exercised.\nLean: community projects https://github.com/arienmalec/axler and\nhttps://github.com/martincmartin/linear_algebra_done_right (partial)."}, "axler-measure-integration-real-analysis": {"label": "Axler, Measure, Integration & Real Analysis", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "https://measure.axler.net/", "course": "measure-theory", "prereqs": ["analysis-foundations", "linear-algebra-basic"], "detail": "", "notes": "Author: Axler. Measure theory, Lp, Hilbert spaces, spectral theory\nof compact operators, Fourier analysis, probability — in the same\nclean, motivated style as *Linear Algebra Done Right*. Assumes only\nundergraduate real analysis, so it can follow Tao I directly. Free\nonline (open access)."}, "baez-muniain-gauge-fields-knots-gravity": {"label": "Baez & Muniain, Gauge Fields, Knots and Gravity", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "characteristic-classes", "prereqs": ["analysis-advanced", "linear-algebra-basic"], "detail": "", "notes": "Authors: John Baez, Javier Muniain. Manifolds, forms, and de Rham\ncohomology via Maxwell's equations; Lie groups, bundles, connections,\ncurvature via Yang–Mills and Chern–Simons; then general relativity.\nExtremely motivated and conversational, exercises woven into the\ntext. The lightest route to *why* connections and curvature matter."}, "berger-panoramic-riemannian": {"label": "Berger, A Panoramic View of Riemannian Geometry", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "riemannian-geometry", "prereqs": ["smooth-manifolds"], "detail": "", "notes": "Author: Marcel Berger. A 800-page survey of what is known and why\nit matters, with sketches rather than proofs. For browsing once the\nbasics are in place."}, "bonfert-taylor-complex-analysis-videos": {"label": "Bonfert-Taylor, Introduction to Complex Analysis (video lectures)", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PLi7yHjesblV0sSfZzWdSUXGO683n_nJdQ", "course": "complex-analysis", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Lecturer: Petra Bonfert-Taylor (Wesleyan, Coursera). 36 videos:\ncomplex-plane geometry, Julia and Mandelbrot sets, conformal maps,\nCauchy theory, Laurent series, residues, a glimpse of zeta. Gentle and\ngeometric; a first pass with Needham before Stein–Shakarchi."}, "borcherds-algebraic-geometry-1-videos": {"label": "Borcherds, Algebraic Geometry I: Varieties (video lectures)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL8yHsr3EFj53j51FG6wCbQKjBgpjKa5PX", "course": "algebraic-geometry-classical", "prereqs": ["commutative-algebra-basic"], "detail": "", "notes": "Lecturer: Richard Borcherds (Berkeley 256A, 2020). 51 videos opening\nwith two cubic curves and Bézout–Pappus–Pascal before the general\ntheory of varieties. Examples first, historically motivated. Pairs\nwith Reid or Shafarevich. An extra-topics playlist covers Riemann–Roch\nfor curves: PL8yHsr3EFj53Rwr6ly1oUasJXR2Qerwgj."}, "borcherds-categories-videos": {"label": "Borcherds, Categories for the Idle Mathematician (video lectures)", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL8yHsr3EFj51F9XZ_Ka4bLnQoxTdMx0AL", "course": "category-theory-elementary", "prereqs": [], "detail": "", "notes": "Lecturer: Richard Borcherds. 7 short lectures: categories, functors,\nnatural transformations, Yoneda, adjoints, with examples from all over\nmathematics. A quick companion to Lawvere or Leinster."}, "borcherds-commutative-algebra-videos": {"label": "Borcherds, Commutative Algebra (video lectures)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL8yHsr3EFj53rSexSz7vsYt-3rpHPR3HB", "course": "commutative-algebra-basic", "prereqs": ["algebra-basic"], "detail": "", "notes": "Lecturer: Richard Borcherds. 76 short videos on graduate commutative\nalgebra — rings, ideals, modules, syzygies, Noetherian rings,\nNullstellensatz, localization, primary decomposition, dimension.\nInformal, example-heavy, always explaining why a definition exists.\nWatch alongside Reid or Eisenbud; supplies the motivation\nAtiyah–Macdonald leaves out."}, "borcherds-complex-analysis-videos": {"label": "Borcherds, Complex Analysis (video lectures)", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL8yHsr3EFj537_iYA5QrvwhvMlpkJ1yGN", "course": "complex-analysis", "prereqs": ["analysis-foundations"], "detail": "", "notes": "Lecturer: Richard Borcherds. A short graduate-flavored course: Cauchy\ntheory, residues, conformal maps, special functions, with his usual\nexamples and asides. Terser than Bonfert-Taylor; a second pass next to\nStein–Shakarchi."}, "borcherds-galois-theory-videos": {"label": "Borcherds, Galois Theory (video lectures)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL8yHsr3EFj53Zxu3iRGMYL_89GDMvdkgt", "course": "galois-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Lecturer: Richard Borcherds. 25 half-hour videos from field extensions\nand splitting fields to the main theorem and applications. Brisk,\nexample-rich, good on history. A fast second pass next to Cox or\nStewart."}, "borcherds-group-theory-videos": {"label": "Borcherds, Group Theory (video lectures)", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL8yHsr3EFj51pjBvvCPipgAT3SYpIiIsJ", "course": "algebra-basic", "prereqs": [], "detail": "", "notes": "Lecturer: Richard Borcherds. 32 videos from Cayley's theorem and\nhomomorphisms through a first course, with many concrete groups. A\nsequel, \"Rings and modules\" (22 videos), is at\nPL8yHsr3EFj52XDLrmvrFDgwcf6XOm2TEE. Light, example-heavy companion to\nPinter, Artin, or Aluffi."}, "borcherds-homological-algebra-videos": {"label": "Borcherds, Introduction to Homological Algebra (video lectures)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL8yHsr3EFj53tlhAM-Zf0pRKNB541ZTi2", "course": "homological-algebra", "prereqs": ["algebra-basic"], "detail": "", "notes": "Lecturer: Richard Borcherds. 6 lectures starting from Tor for abelian\ngroups: the concrete computations that motivate derived functors.\nWatch before Rotman."}, "borcherds-lie-groups-videos": {"label": "Borcherds, Lie Groups (video lectures)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL8yHsr3EFj53RWBkiHKoOsTw-dGHAoJ-h", "course": "lie-theory", "prereqs": ["linear-algebra-basic"], "detail": "", "notes": "Lecturer: Richard Borcherds. 12 videos: a short, example-driven tour\nof Lie groups and Lie algebras. Watch alongside Stillwell's *Naive Lie\nTheory*. The same channel also has short courses on representation\ntheory, homological algebra, number theory, and category theory."}, "borcherds-modular-forms-videos": {"label": "Borcherds, Modular Forms (video lectures)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL8yHsr3EFj51HisRtNyzHX-Xyg6I3Wl2F", "course": "modular-forms", "prereqs": ["complex-analysis"], "detail": "", "notes": "Lecturer: Richard Borcherds, a modular-forms and moonshine expert. 13\nvideos from Eisenstein series and their coefficients onward — a quick\nconcrete orientation before Koblitz or Diamond–Shurman. His 4-video\n\"Elliptic functions\" playlist (PL8yHsr3EFj50t6hrPaJ0GruNrN-xPcFTI) is a\ngood warm-up."}, "borcherds-number-theory-115-videos": {"label": "Borcherds, Introduction to Number Theory — Berkeley Math 115 (video lectures)", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL8yHsr3EFj53L8sMbzIhhXSAOpuZ1Fov8", "course": "number-theory-basic", "prereqs": [], "detail": "", "notes": "Lecturer: Richard Borcherds. A full undergraduate elementary number\ntheory course (about 50 lectures): divisibility, congruences,\nquadratic reciprocity, Diophantine equations, continued fractions.\nWatch alongside Niven or Stillwell."}, "borcherds-representation-theory-videos": {"label": "Borcherds, Representation Theory (video lectures)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL8yHsr3EFj51AM_VmB0VygPIzcUCH_jUG", "course": "representation-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Lecturer: Richard Borcherds. 10 lectures on representations and\ncharacters of finite groups with worked examples. Pairs with\nJames–Liebeck."}, "borcherds-schemes-videos": {"label": "Borcherds, Algebraic Geometry II: Schemes (video lectures)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL8yHsr3EFj50Un2NpfPySgXctRQK7CLG-", "course": "algebraic-geometry", "prereqs": ["commutative-algebra-basic"], "detail": "", "notes": "Lecturer: Richard Borcherds. 48 videos from sheaves and étale spaces\nthrough scheme theory, with plenty of examples and pathologies. An\nantidote to abstraction; watch in parallel with Vakil."}, "borcherds-theory-of-numbers-videos": {"label": "Borcherds, Theory of Numbers (video lectures)", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL8yHsr3EFj52Qf7lc3HHvHRdIysxEcj1H", "course": "number-theory-basic", "prereqs": [], "detail": "", "notes": "Lecturer: Richard Borcherds. A second number theory series (about 20\nlectures), faster and more wide-ranging than his Math 115 course."}, "borcherds-zermelo-fraenkel-videos": {"label": "Borcherds, Zermelo–Fraenkel Axioms (video lectures)", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL8yHsr3EFj52EKVgPi-p50fRP2_SbG2oi", "course": "set-theory-basic", "prereqs": [], "detail": "", "notes": "Lecturer: Richard Borcherds. 8 lectures on the ZF axioms, what each is\nfor, and the models that show their independence. A companion to\nShen–Vereshchagin or Enderton."}, "borevich-shafarevich-number-theory": {"label": "Borevich & Shafarevich, Number Theory", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "russian", "problems": false, "medium": "book", "url": "", "course": "algebraic-number-theory", "prereqs": ["algebra-basic", "number-theory-basic"], "detail": "", "notes": "Authors: Borevich, Shafarevich. Algebraic number theory driven by\nDiophantine problems: p-adic numbers, representations by quadratic\nforms, the theory of divisibility, local methods, analytic class\nnumber formulas, Fermat's Last Theorem for regular primes. Concrete\nand problem-motivated, with exercises; a very different organization\nfrom Marcus or Neukirch."}, "bott-tu-differential-forms": {"label": "Bott & Tu, Differential Forms in Algebraic Topology", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "characteristic-classes", "prereqs": ["smooth-manifolds"], "detail": "", "notes": "Authors: Bott, Tu. De Rham cohomology, Mayer–Vietoris, Poincaré\nduality, Thom isomorphism, Čech–de Rham complex, spectral sequences,\ncharacteristic classes. Topology done with differential forms, and\nthe clearest bridge from the differential side to the sheaf and Čech\ncohomology used in algebraic geometry. Beautifully written."}, "bressoud-radical-approach-real-analysis": {"label": "Bressoud, A Radical Approach to Real Analysis", "status": "open", "covered": true, "skimmed": true, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "analysis-foundations", "prereqs": [], "detail": "alongside Tao I", "notes": "Author: Bressoud. Analysis told through its history: the crisis\nFourier series caused in the 1800s motivates every definition\n(convergence, continuity, uniform convergence, the integral).\nNarrative in the extreme; a good companion that explains *why* the\nrigorous definitions in Tao look the way they do."}, "brezis-functional-analysis": {"label": "Brezis, Functional Analysis, Sobolev Spaces and Partial Differential Equations", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "functional-analysis", "prereqs": ["analysis-advanced", "linear-algebra-basic", "measure-theory"], "detail": "", "notes": "Author: Brezis. Narrative graduate text: Hahn–Banach, weak\ntopologies, Lp and Sobolev spaces, linear and semilinear PDE. Well-\nmotivated, exercised, written to be read cover-to-cover."}, "brzezinski-galois-theory-through-exercises": {"label": "Brzeziński, Galois Theory Through Exercises", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": true, "medium": "book", "url": "", "course": "galois-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Juliusz Brzeziński. Classical Galois theory built through\ngraded, concrete exercises, each chapter opened by a short summary;\nincludes Galois's theorem on equations of prime degree, the quintic,\nresolvents, and the inverse Galois problem. Designed for self-study.\nThe Galois-theory sibling of Murty–Esmonde."}, "buzzard-formalising-mathematics": {"label": "Buzzard, Formalising Mathematics (course notes)", "status": "open", "covered": true, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://github.com/ImperialCollegeLondon/formalising-mathematics-2024", "course": "formalization-lean", "prereqs": [], "detail": "", "notes": "Author: Kevin Buzzard (Imperial College). A university course in\nformalizing undergraduate mathematics in Lean 4 — logic, sets,\nfunctions, groups, filters and topology — with an exercise repository.\nPitched at mathematicians, not programmers. Free."}, "buzzard-msri-langlands-videos": {"label": "Buzzard, Automorphic Forms and the Langlands Program (video lectures, MSRI)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PLhsb6tmzSpiysoRR0bZozub-MM0k3mdFR", "course": "automorphic-forms", "prereqs": ["class-field-theory", "modular-forms"], "detail": "", "notes": "Lecturer: Kevin Buzzard (MSRI Summer Graduate School, 2017). 20\nlectures explaining local and global Langlands by working examples —\nDirichlet characters and class field theory, modular forms,\nautomorphic representations of GL(n). Notes at\nhttps://www.ma.imperial.ac.uk/~buzzard/MSRI/. The destination preview\nafter class field theory and Diamond–Shurman. More series indexed at\nhttps://langlandslearninggroup.github.io/video_lecture.html."}, "carter-visual-group-theory": {"label": "Carter, Visual Group Theory", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebra-basic", "prereqs": [], "detail": "", "notes": "Author: Nathan Carter. Groups through Cayley diagrams, multiplication\ntables, and pictures of subgroups, quotients, and actions. Visual\nand very light — for building intuition before or during\n[[algebra-basic]], not for rigor."}, "casella-berger-statistical-inference": {"label": "Casella & Berger, Statistical Inference", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "statistics-basic", "prereqs": ["probability-basic"], "detail": "", "notes": "Authors: Casella, Berger. Standard graduate mathematical statistics.\nEstimation, sufficiency, likelihood, hypothesis testing, confidence\nintervals, large-sample asymptotics. Proof-oriented with extensive\nexercises; builds on probability foundations."}, "cassels-frohlich-algebraic-number-theory": {"label": "Cassels & Fröhlich, Algebraic Number Theory", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "class-field-theory", "prereqs": ["algebraic-number-theory"], "detail": "", "notes": "Editors: Cassels, Fröhlich. The 1965 Brighton proceedings: Serre on\nlocal CFT, Tate on global CFT, Tate's thesis, and the famous \"Tate's\nexercises\" (Hilbert symbols, local–global, Kronecker–Weber). Terse\nsurvey chapters — a poor first book. Buzzard hosts full solutions to\nthe exercises, which make a natural Lean project. Tate's thesis is the\nfirst step toward automorphic forms.\nExercise solutions (Ni, hosted by Buzzard):\nhttps://www.ma.imperial.ac.uk/~buzzard/Cassels_Froehlich_Exercises.pdf"}, "chen-infinitely-large-napkin": {"label": "Chen, An Infinitely Large Napkin", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://web.evanchen.cc/napkin.html", "course": "mathematical-panorama", "prereqs": [], "detail": "", "notes": "Author: Evan Chen. A panoramic tour from algebra and topology through\nrepresentation theory, complex analysis, measure theory, differential\ngeometry, algebraic topology, category theory, algebraic number theory\n(through Artin reciprocity), and schemes. \"Why before how\", in an\nolympiad teacher's voice, with problems. Read the relevant part before\nstarting each new course."}, "childress-class-field-theory": {"label": "Childress, Class Field Theory", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "class-field-theory", "prereqs": ["algebraic-number-theory"], "detail": "", "notes": "Author: Childress. A short, readable first course in class field\ntheory: Dirichlet series and densities, ideal-theoretic CFT, then the\nidelic formulation. Aimed at students who have just finished a first\nalgebraic number theory course. The general theory Cox's book\nmotivates through examples."}, "chua-cambridge-notes": {"label": "Chua, Cambridge Lecture Notes (live-TeXed)", "status": "open", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://dec41.user.srcf.net/notes/", "course": "mathematical-panorama", "prereqs": [], "detail": "", "notes": "Author: Dexter Chua (student notes). Live-TeXed notes of Cambridge\nPart IB–III courses with example sheets: Number Fields, Local Fields,\nModular Forms and L-functions, Differential Geometry, Algebraic\nTopology, and many more. Student notes rather than designed texts —\na source of problems and a second explanation."}, "conrad-expository-papers": {"label": "Conrad, Expository Papers (\"blurbs\")", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "notes", "url": "https://kconrad.math.uconn.edu/blurbs/", "course": "galois-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Keith Conrad. Hundreds of short self-contained handouts on\ngroup theory, rings and fields, Galois theory, multilinear algebra,\nand algebraic number theory — each example-heavy and easy to turn\ninto Lean exercises. The best free second explanation for any sticking\npoint on the arithmetic arc."}, "cox-galois-theory": {"label": "Cox, Galois Theory", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "galois-theory", "prereqs": ["algebra-basic"], "detail": "", "notes": "Author: Cox. Historically-motivated, narrative treatment of Galois\ntheory through the solvability of polynomials. Heavy exercises,\nconcrete examples. Same author as *Primes of the Form x²+ny²*."}, "cox-little-oshea-ideals-varieties-algorithms": {"label": "Cox, Little, O'Shea — Ideals, Varieties, and Algorithms", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "algebraic-geometry-classical", "prereqs": ["algebra-basic"], "detail": "", "notes": "Authors: Cox, Little, O'Shea. Affine and projective varieties,\nGröbner bases, elimination, the Nullstellensatz, dimension —\neverything made computable. Undergraduate, exceptionally motivated,\nhuge exercise sets. The natural first algebraic geometry book, and it\nmakes commutative algebra feel necessary before you study it."}, "cox-primes-of-form": {"label": "Cox, Primes of the Form x² + ny²", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "class-field-theory", "prereqs": ["algebra-basic", "number-theory-basic", "galois-theory"], "detail": "", "notes": "Author: Cox. Class field theory developed to answer one concrete\nquestion: which primes are represented by x² + ny²? Narrative,\nmotivated, bridges elementary number theory to CFT and complex\nmultiplication. Later chapters use complex analysis."}, "crane-discrete-differential-geometry-videos": {"label": "Crane, Discrete Differential Geometry (video lectures)", "status": "locked", "covered": false, "skimmed": false, "companion": true, "tradition": "", "problems": false, "medium": "video", "url": "https://www.youtube.com/playlist?list=PL9_jI1bdZmz0hIrNCMQW1YmZysAiIYSSS", "course": "differential-geometry-classical", "prereqs": ["linear-algebra-basic", "analysis-foundations"], "detail": "", "notes": "Lecturer: Keenan Crane (CMU 15-458). About 21 lectures: curves and\nsurfaces, discrete differential forms and exterior calculus,\ncurvature, with notes and assignments on the course site. Forms and\ncurvature become concrete objects on meshes; a strong intuition pump\nnext to Hubbard, Needham, and do Carmo."}, "demidovich-problems-analysis": {"label": "Demidovich, Problems in Mathematical Analysis", "status": "open", "covered": true, "skimmed": false, "companion": true, "tradition": "russian", "problems": true, "medium": "book", "url": "", "course": "analysis-foundations", "prereqs": [], "detail": "", "notes": "Editor: B. P. Demidovich. The classic Soviet problem book: thousands\nof calculus and analysis exercises, graded from routine to hard,\nwith answers. Not a text to read — a place to go when you want\nconcrete computational practice."}, "diamond-shurman-modular-forms": {"label": "Diamond & Shurman, A First Course in Modular Forms", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "modular-forms", "prereqs": ["complex-analysis", "algebra-basic"], "detail": "", "notes": "Authors: Diamond, Shurman. Modular forms and modular curves through\nEichler–Shimura and the modularity theorem, ending with Galois\nrepresentations. Heavily exercised and motivated. Early chapters need\nonly complex analysis and algebra; later ones lean on\n[[algebraic-number-theory]] and [[riemann-surfaces]]. The natural\nbook on the Langlands arc after Koblitz."}, "do-carmo-curves-and-surfaces": {"label": "do Carmo, Differential Geometry of Curves and Surfaces", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "differential-geometry-classical", "prereqs": ["analysis-advanced", "linear-algebra-basic"], "detail": "", "notes": "Author: do Carmo. Classical differential geometry — curves, regular\nsurfaces, Gauss map, intrinsic geometry, Gauss–Bonnet. Concrete,\nexercised, widely loved as a first differential-geometry text\nbefore smooth manifolds."}, "do-carmo-riemannian-geometry": {"label": "do Carmo, Riemannian Geometry", "status": "locked", "covered": false, "skimmed": false, "companion": false, "tradition": "", "problems": false, "medium": "book", "url": "", "course": "riemannian-geometry", "prereqs": ["smooth-manifolds"], "detail": "", "notes": "Author: do Carmo. Classic graduate introduction to Riemannian\ngeometry: connections, geodesics, curvature, Jacobi fields, spaces\nof constant curvature. Compact and well-regarded."}, "donaldson-riemann-surfaces": {"label": "
